<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Arafah Guide & Duas — step-by-step companion, 1000 duas, and Names of Allah.">
  <meta name="theme-color" content="#07101e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Arafah Guide & Duas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-moon">☽</span>
        <span class="logo-text">Arafah Guide</span>
      </div>
      <div class="header-actions" id="headerActions">
        <button class="btn-icon" id="btnFavFilter" aria-label="Saved duas" title="Saved">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnSearch" aria-label="Search duas" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Bar (duas mode only) -->
    <div class="search-bar" id="searchBar" role="search">
      <div class="search-inner">
        <svg class="search-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="search"
          id="searchInput"
          placeholder="Search duas…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search duas"
        >
        <button class="btn-icon" id="btnCloseSearch" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Guide sub-tabs (guide mode only) -->
    <div class="guide-subtabs" id="guideSubtabs">
      <button class="guide-tab is-active" id="tabArafah" onclick="switchGuideSub('arafah')">🌅 Arafah</button>
      <button class="guide-tab" id="tabMuzdalifah" onclick="switchGuideSub('muzdalifah')">🌙 Muzdalifah</button>
    </div>

    <!-- Card Stack Area -->
    <main class="card-area" id="cardArea" aria-live="polite" aria-label="Card">

      <div class="card-stack" id="cardStack">
        <!-- Depth cards (visual only) -->
        <div class="card card--depth2" id="cardDepth2" aria-hidden="true"></div>
        <div class="card card--depth1" id="cardDepth1" aria-hidden="true"></div>

        <!-- Active card -->
        <div class="card card--front" id="cardFront" role="article" tabindex="0">
          <div class="card-inner" id="cardInner">
            <!-- Content injected by JS -->
          </div>
        </div>
      </div>

      <!-- Swipe indicators -->
      <div class="swipe-label swipe-prev" id="swipeIndicatorPrev" aria-hidden="true">← Prev</div>
      <div class="swipe-label swipe-next" id="swipeIndicatorNext" aria-hidden="true">Next →</div>

      <!-- First-time hint -->
      <p class="swipe-hint" id="swipeHint" aria-hidden="true">swipe to explore</p>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottom-bar">

      <!-- Duas mode: inspire + chips -->
      <div id="duasBottomSection">
        <div class="inspire-row">
          <button class="btn-inspire" id="btnInspire" aria-label="Inspire me with a random dua">
            <span class="inspire-icon">✦</span>
            Inspire me
          </button>
        </div>
        <div class="chips-track" id="chipsTrack" role="list" aria-label="Filter by category">
          <!-- Chips injected by JS -->
        </div>
      </div>

      <!-- Names mode: progress line -->
      <div class="names-footer" id="namesFooterSection" style="display:none">
        <span class="names-progress" id="namesProgress">Name 1 of 30</span>
      </div>

      <!-- Mode navigation (always visible) -->
      <nav class="mode-nav" aria-label="Mode navigation">
        <button class="mode-tab is-active" id="modeGuide" onclick="switchMode('guide')" aria-label="Guide">
          🕌 Guide
        </button>
        <button class="mode-tab" id="modeDuas" onclick="switchMode('duas')" aria-label="Duas">
          📿 Duas
        </button>
        <button class="mode-tab" id="modeNames" onclick="switchMode('names')" aria-label="Names">
          ✨ Names
        </button>
      </nav>

    </footer>

  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
