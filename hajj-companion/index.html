<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حَجّ — Hajj Companion 1447</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04080f;
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --green: #1f7a4c;
  --green2: #4ec991;
  --glass: rgba(255,255,255,0.065);
  --glass2: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.11);
  --border-gold: rgba(201,168,76,0.28);
  --text: #f0ead6;
  --muted: rgba(240,234,214,0.52);
  --r: 20px;
  --rs: 12px;
  --shadow: 0 6px 36px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 110% 55% at 5% 5%, rgba(12,32,85,0.72) 0%,transparent 60%),
    radial-gradient(ellipse 80% 60% at 95% 95%, rgba(44,12,75,0.62) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 40% 65%, rgba(8,48,28,0.22) 0%,transparent 55%);
}
/* stars */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.35) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 12%, rgba(255,255,255,0.28) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.22) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 60%, rgba(255,255,255,0.30) 0%,transparent 100%),
    radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.20) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 62% 85%, rgba(201,168,76,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 10% 88%, rgba(255,255,255,0.25) 0%,transparent 100%);
  pointer-events:none;z-index:0;
}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}

/* ── Glass ── */
.glass{
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
}
.glass-gold{background:rgba(201,168,76,0.07);border-color:var(--border-gold);box-shadow:var(--shadow),0 0 24px rgba(201,168,76,0.07);}
.glass-green{background:rgba(31,122,76,0.08);border-color:rgba(31,122,76,0.22);}

/* ── Header ── */
.hdr{padding:22px 18px 0;text-align:center;}
.hdr-bismillah{font-family:'Amiri',serif;font-size:26px;color:var(--gold);line-height:1.4;margin-bottom:4px;}
.hdr-sub{font-size:11px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);}

/* ── Today Banner ── */
.today-banner{margin:14px 14px 0;padding:15px 16px;}
.today-label{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.today-title{font-size:16px;font-weight:700;margin-bottom:2px;}
.today-sub{font-size:12px;color:var(--muted);}
.counts{display:flex;gap:8px;margin-top:13px;}
.cbox{flex:1;background:rgba(201,168,76,0.09);border:1px solid rgba(201,168,76,0.18);border-radius:var(--rs);padding:9px 4px;text-align:center;}
.cnum{font-size:24px;font-weight:800;color:var(--gold);line-height:1;}
.clbl{font-size:8px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

/* ── Bottom Tab Bar ── */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(4,8,15,0.88);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-top:1px solid rgba(255,255,255,0.09);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom, 8px);
}
.tab{flex:1;padding:10px 4px 6px;border:none;background:transparent;color:var(--muted);
  font-family:inherit;font-size:10px;font-weight:600;letter-spacing:0.04em;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.2s;}
.tab-ico{font-size:20px;line-height:1;}
.tab.active{color:var(--gold2);}

/* ── Panels ── */
.panel{display:none;padding:12px 14px 120px;flex:1;}
.panel.active{display:block;}

/* ── Section Label ── */
.slabel{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin:18px 0 9px;padding-left:2px;}

/* ── Journey Day Cards ── */
.dcard{margin-bottom:9px;border-radius:var(--r);overflow:hidden;}
.dhdr{padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:11px;user-select:none;}
.ddot{width:42px;height:42px;border-radius:50%;background:rgba(201,168,76,0.10);border:1.5px solid rgba(201,168,76,0.28);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.ddot.today-dot{background:rgba(201,168,76,0.22);border-color:var(--gold);box-shadow:0 0 14px rgba(201,168,76,0.32);}
.ddot.past{opacity:0.38;}
.dinfo{flex:1;min-width:0;}
.dname{font-size:14px;font-weight:700;margin-bottom:2px;}
.dmeta{font-size:11px;color:var(--muted);}
.dbadge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap;flex-shrink:0;}
.dbadge-gold{background:rgba(201,168,76,0.14);color:var(--gold);border:1px solid rgba(201,168,76,0.22);}
.dbadge-green{background:rgba(31,122,76,0.18);color:var(--green2);border:1px solid rgba(31,122,76,0.28);}
.dbadge-red{background:rgba(180,40,40,0.18);color:#ff8a8a;border:1px solid rgba(180,40,40,0.25);}
.dchev{color:var(--muted);font-size:12px;transition:transform 0.22s;flex-shrink:0;}
.dcard.open .dchev{transform:rotate(90deg);}
.dsteps{display:none;padding:0 15px 13px;}
.dcard.open .dsteps{display:block;}

/* ── Steps ── */
.step{padding:11px 0;border-top:1px solid rgba(255,255,255,0.055);display:flex;gap:11px;}
.sico{width:32px;height:32px;background:rgba(255,255,255,0.06);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:1px;}
.sbody{flex:1;min-width:0;}
.stitle{font-size:13px;font-weight:700;margin-bottom:4px;}
.sdesc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:7px;}
.sarabic{
  font-family:'Amiri',serif;font-size:19px;color:var(--gold);
  direction:rtl;text-align:right;line-height:1.9;
  padding:9px 12px;margin-bottom:5px;
  background:rgba(201,168,76,0.055);border-radius:var(--rs);
  border-right:2px solid rgba(201,168,76,0.3);
}
.strans{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:3px;line-height:1.5;}
.senglish{font-size:12px;line-height:1.55;margin-bottom:5px;}
.surdu{font-family:'Amiri',serif;font-size:15px;color:rgba(201,168,76,0.72);direction:rtl;text-align:right;line-height:1.9;margin-bottom:4px;}
.ssource{font-size:10px;color:rgba(201,168,76,0.42);font-weight:700;}
.snote{margin-top:6px;padding:7px 10px;background:rgba(31,122,76,0.10);border-radius:8px;font-size:11px;color:var(--green2);border-left:2px solid rgba(31,122,76,0.4);line-height:1.5;}
.snote-amber{background:rgba(201,168,76,0.08);color:var(--gold2);border-left-color:rgba(201,168,76,0.35);}

/* ── Family Duas ── */
.addform{padding:15px;margin-bottom:10px;}
.flabel{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:10px;}
.finput,.ftextarea{
  width:100%;background:rgba(255,255,255,0.07);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--text);font-family:inherit;font-size:13px;
  padding:10px 12px;outline:none;transition:border-color 0.2s;
}
.ftextarea{resize:none;height:70px;line-height:1.5;}
.finput:focus,.ftextarea:focus{border-color:rgba(201,168,76,0.38);}
.finput::placeholder,.ftextarea::placeholder{color:var(--muted);}
.frow{display:flex;gap:8px;margin-bottom:8px;}
.fcol{flex:1;}
.btn-add{width:100%;padding:11px;background:rgba(201,168,76,0.13);border:1px solid rgba(201,168,76,0.28);
  border-radius:var(--rs);color:var(--gold2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.18s;}
.btn-add:active{background:rgba(201,168,76,0.24);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fcard{padding:13px;border-radius:var(--r);}
.fname{font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.fcheck{width:22px;height:22px;border:1.5px solid var(--border);border-radius:50%;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 0.2s;flex-shrink:0;}
.fcheck.done{background:rgba(31,122,76,0.28);border-color:var(--green2);color:var(--green2);}
.fdua{font-size:12px;color:var(--muted);line-height:1.5;}
.fdel{background:none;border:none;color:rgba(255,255,255,0.18);cursor:pointer;font-size:10px;padding:0;margin-top:8px;font-family:inherit;}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13px;}
.empty-ico{font-size:36px;opacity:0.35;margin-bottom:10px;}

/* ── Adhkar ── */
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.pills::-webkit-scrollbar{display:none;}
.pill{padding:7px 13px;border-radius:28px;background:var(--glass);border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all 0.18s;font-family:inherit;}
.pill.active{background:rgba(201,168,76,0.13);border-color:rgba(201,168,76,0.32);color:var(--gold2);}
.duacard{margin-bottom:11px;padding:15px;}
.dtitle{font-size:13px;font-weight:800;margin-bottom:3px;}
.docc{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:0.05em;margin-bottom:9px;}
.darabic{
  font-family:'Amiri',serif;font-size:22px;color:var(--gold);
  direction:rtl;text-align:right;line-height:2;
  padding:12px 14px;background:rgba(201,168,76,0.05);
  border-radius:var(--rs);border-right:2px solid rgba(201,168,76,0.25);margin-bottom:10px;
}
.dtrans{font-size:11px;color:var(--muted);font-style:italic;line-height:1.6;margin-bottom:7px;}
.denglish{font-size:13px;line-height:1.6;margin-bottom:7px;}
.durdu{font-family:'Amiri',serif;font-size:16px;color:rgba(201,168,76,0.72);direction:rtl;text-align:right;line-height:1.9;border-top:1px solid var(--border);padding-top:8px;margin-top:8px;}
.dsource{font-size:10px;color:rgba(201,168,76,0.4);font-weight:700;margin-top:8px;}
.ayatcard .darabic{color:var(--green2);border-right-color:rgba(31,122,76,0.4);background:rgba(31,122,76,0.06);}
.ayatcard .docc{color:var(--green2);}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="hdr-sub">Hajj Companion · 1447 H</div>
  </div>
  <div class="today-banner glass glass-gold" id="todayBanner"></div>

  <div class="panel active" id="panel-journey">
    <div class="slabel">📅 Your Journey</div>
    <div id="journeyList"></div>
  </div>

  <div class="panel" id="panel-family">
    <div class="slabel">🤲 Family Duas</div>
    <div class="addform glass">
      <div class="flabel">Add a family member's dua request</div>
      <div class="frow">
        <div class="fcol"><input class="finput" id="fname" placeholder="Name" /></div>
        <div class="fcol"><input class="finput" id="frelation" placeholder="Relation" /></div>
      </div>
      <div style="margin-bottom:8px">
        <textarea class="ftextarea" id="fduareq" placeholder="Their dua request (e.g. shifa, rizq, marriage, children…)"></textarea>
      </div>
      <button class="btn-add" onclick="addFamily()">+ Add to List</button>
    </div>
    <div id="familyGrid"></div>
  </div>

  <div class="panel" id="panel-adhkar">
    <div class="slabel">📿 Duas &amp; Adhkar</div>
    <div class="pills" id="catPills"></div>
    <div id="duaList" style="margin-top:12px"></div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-tab="journey" onclick="switchTab('journey')">
      <span class="tab-ico">🗺</span>Journey
    </button>
    <button class="tab" data-tab="family" onclick="switchTab('family')">
      <span class="tab-ico">🤲</span>Family
    </button>
    <button class="tab" data-tab="adhkar" onclick="switchTab('adhkar')">
      <span class="tab-ico">📿</span>Adhkar
    </button>
  </nav>
</div>

     trans:'Āʾibūna tāʾibūna ʿābidūna li Rabbinā ḥāmidūn',
     english:'We are returning, repenting, worshipping, and praising our Lord.',
     urdu:'ہم لوٹ رہے ہیں، توبہ کرتے ہوئے، عبادت کرتے ہوئے، اپنے رب کی تعریف کرتے ہوئے۔',
     source:'Muslim 1342', ayat:false}
  ],
  madinah: [
    {title:'Entering Masjid al-Nabawi', occ:'When entering any mosque',
     arabic:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',
     trans:'Allāhumma iftaḥ lī abwāba raḥmatik',
     english:'O Allah, open for me the gates of Your mercy.',
     urdu:'اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔',
     source:'Muslim 713', ayat:false},
    {title:'Durood Ibrahim — Salawat', occ:'Send blessings on the Prophet ﷺ abundantly in Madinah',
     arabic:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ',
     trans:'Allāhumma ṣalli ʿalā Muḥammadin wa ʿalā āli Muḥammad…',
     english:'O Allah, send blessings upon Muhammad and the family of Muhammad, as You sent blessings upon Ibrahim and the family of Ibrahim — You are indeed Praiseworthy and Glorious.',
     urdu:'اے اللہ! محمدؐ اور آل محمدؐ پر رحمت نازل فرما جیسے ابراہیم اور آل ابراہیم پر نازل فرمائی۔ بے شک تو تعریف والا، بزرگی والا ہے۔',
     source:'Bukhari 3370 / Muslim 406', ayat:false},
    {title:'Greeting the Prophet ﷺ at Rawdha', occ:'Standing before the blessed grave',
     arabic:'السَّلَامُ عَلَيْكَ يَا رَسُولَ اللَّهِ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، أَشْهَدُ أَنَّكَ قَدْ بَلَّغْتَ الرِّسَالَةَ وَأَدَّيْتَ الْأَمَانَةَ وَنَصَحْتَ الْأُمَّةَ',
     trans:'Al-salāmu ʿalayka yā Rasūlallāh wa raḥmatullāhi wa barakātuh…',
     english:'Peace be upon you, O Messenger of Allah, and the mercy of Allah and His blessings. I bear witness that you conveyed the message, fulfilled the trust, and gave sincere advice to the Ummah.',
     urdu:'آپ پر سلام ہو، اے اللہ کے رسول! اور اللہ کی رحمت و برکت ہو۔ میں گواہی دیتا ہوں کہ آپ نے پیغام پہنچایا، امانت ادا کی اور امت کی خیر خواہی فرمائی۔',
     source:'Classical fiqh sources', ayat:false},
    {title:'Dua for the Deceased (Baqi)', occ:'At Jannatul Baqi cemetery',
     arabic:'السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلَاحِقُونَ، يَرْحَمُ اللَّهُ الْمُسْتَقْدِمِينَ مِنَّا وَمِنْكُمْ وَالْمُسْتَأْخِرِينَ',
     trans:'Al-salāmu ʿalaykum ahl al-diyāri min al-muʾminīna wal-muslimīn…',
     english:'Peace be upon you O believing and Muslim residents of these dwellings. We will, Allah willing, join you. May Allah have mercy on those of us and you who have gone ahead and those who come later.',
     urdu:'اے اس گھر کے رہنے والے مومنو اور مسلمانو! آپ پر سلام ہو۔ انشاءاللہ ہم بھی آپ سے ملنے والے ہیں۔ اللہ ہم میں سے اور آپ میں سے پہلے جانے والوں اور بعد میں آنے والوں پر رحم فرمائے۔',
     source:'Muslim 975', ayat:false}
  ],
  umrah: [
    {title:'Talbiyah — The Call of Hajj', occ:'Recite continuously from Ihram until Tawaf begins',
     arabic:'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ',
     trans:'Labbayk Allāhumma labbayk, labbayka lā sharīka laka labbayk, innal-ḥamda wan-niʿmata laka wal-mulk, lā sharīka lak',
     english:'Here I am O Allah, here I am. Here I am, You have no partner, here I am. Verily all praise, grace and sovereignty belong to You. You have no partner.',
     urdu:'حاضر ہوں اے اللہ، حاضر ہوں! حاضر ہوں، تیرا کوئی شریک نہیں، حاضر ہوں! بے شک تمام تعریفیں، نعمتیں اور بادشاہی تیری ہے، تیرا کوئی شریک نہیں۔',
     source:'Bukhari 1549 / Muslim 1184', ayat:false},
    {title:'At Hajar Aswad — Starting Each Circuit', occ:'At the start of each of 7 circuits of Tawaf',
     arabic:'بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ',
     trans:'Bismillāh, wallāhu akbar',
     english:'In the name of Allah, and Allah is the Greatest.',
     urdu:'اللہ کے نام سے، اور اللہ سب سے بڑا ہے۔',
     source:'Bukhari 1613', ayat:false},
    {title:'Rabbana Atina — Between Rukn Yamani & Hajar Aswad', occ:'In the last stretch of each Tawaf circuit',
     arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',
     trans:'Rabbanā ātinā fid-dunyā ḥasanatan wa fil-ākhirati ḥasanatan wa qinā ʿadhāban-nār',
     english:'Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.',
     urdu:'اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھی بھلائی دے اور ہمیں آگ کے عذاب سے بچا۔',
     source:'Quran 2:201 / Abu Dawud 1892', ayat:true},
    {title:'At Safa — Beginning Sa\'i', occ:'Standing on Mount Safa before starting Sa\'i',
     arabic:'إِنَّ الصَّفَا وَالْمَرْوَةَ مِن شَعَائِرِ اللَّهِ ۖ أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ',
     trans:'Innaṣ-ṣafā wal-marwata min shaʿāʾirillāh. Abdaʾu bimā badaʾallāhu bih',
     english:'Indeed Safa and Marwa are among the symbols of Allah. I begin with what Allah began with.',
     urdu:'بے شک صفا اور مروہ اللہ کی نشانیوں میں سے ہیں۔ میں اس سے شروع کرتا ہوں جس سے اللہ نے شروع کیا۔',
     source:'Quran 2:158 / Muslim 1218', ayat:true},
    {title:'Dhikr on Safa and Marwa', occ:'Face Qibla on each mount, say 3 times',
     arabic:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ أَنجَزَ وَعْدَهُ وَنَصَرَ عَبْدَهُ وَهَزَمَ الْأَحْزَابَ وَحْدَهُ',
     trans:'Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu yuḥyī wa yumītu wa huwa ʿalā kulli shayʾin qadīr, lā ilāha illallāhu waḥdah, anjaza waʿdah, wa naṣara ʿabdah, wa hazamal-aḥzāba waḥdah',
     english:'None has the right to be worshipped except Allah, alone, without partner. To Him belongs sovereignty and praise. He gives life and causes death and is over all things competent. None has the right to be worshipped except Allah, alone. He fulfilled His promise, gave victory to His servant, and defeated the confederates alone.',
     urdu:'اللہ کے سوا کوئی معبود نہیں، وہ اکیلا، بے شریک ہے، اسی کی بادشاہی ہے اور اسی کی تعریف ہے، وہ جِلاتا اور مارتا ہے اور ہر چیز پر قادر ہے۔ اللہ کے سوا کوئی معبود نہیں، اکیلے نے اپنا وعدہ پورا کیا، اپنے بندے کی مدد کی اور دشمنوں کو اکیلے شکست دی۔',
     source:'Muslim 1218', ayat:false}
  ],
  arafat: [
    {title:'Best Dua of Arafat Day', occ:'Repeat abundantly throughout Arafat wuquf',
     arabic:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
     trans:'Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu wa huwa ʿalā kulli shayʾin qadīr',
     english:'None has the right to be worshipped except Allah alone, without partner. To Him belongs all sovereignty and praise, and He is over all things competent.',
     urdu:'اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے اور اسی کی تعریف ہے، اور وہ ہر چیز پر قادر ہے۔',
     source:'Tirmidhi 3585 — "The best dua is the dua of Arafat day. The best thing I and the Prophets before me have said."', ayat:false},
    {title:'Sayyid al-Istighfar — Master of Forgiveness', occ:'Morning & evening, especially at Arafat',
     arabic:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
     trans:'Allāhumma anta Rabbī lā ilāha illā ant, khalaqtanī wa anā ʿabduk, wa anā ʿalā ʿahdika wa waʿdika mastaṭaʿt, aʿūdhu bika min sharri mā ṣanaʿt, abūʾu laka biniʿmatika ʿalayy, wa abūʾu bidhambī faghfir lī fa-innahū lā yaghfiru adh-dhunūba illā ant',
     english:'O Allah, You are my Lord. There is no god but You. You created me and I am Your slave. I am upon Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessings upon me, and I acknowledge my sin — so forgive me, for none forgives sins except You.',
     urdu:'اے اللہ! تو ہی میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں۔ میں جتنا ہو سکے تیرے عہد پر قائم ہوں۔ میں اپنے کیے کے شر سے تیری پناہ مانگتا ہوں۔ میں تیری نعمتوں کا اقرار کرتا ہوں اور اپنے گناہوں کا بھی — پس مجھے معاف فرما کہ تیرے سوا کوئی گناہ معاف نہیں کرتا۔',
     source:'Bukhari 6306 — "Whoever says this by day with certainty and dies before evening enters Jannah."', ayat:false},
    {title:'Dua of Prophet Yunus ﷺ — For Deliverance', occ:'In moments of distress and need',
     arabic:'لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ',
     trans:'Lā ilāha illā anta subḥānaka innī kuntu minaz-ẓālimīn',
     english:'There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.',
     urdu:'تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ظالموں میں سے تھا۔',
     source:'Quran 21:87 — "No Muslim calls upon Allah with these words for any matter except that Allah responds to him." — Tirmidhi', ayat:true},
    {title:'Dua for Parents & Family', occ:'Make this dua at Arafat for your loved ones',
     arabic:'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ',
     trans:'Rabbigh-fir lī wa liwālidayya wa lil-muʾminīna yawma yaqūmul-ḥisāb',
     english:'My Lord, forgive me and my parents and the believers on the Day when the account is established.',
     urdu:'اے میرے رب! مجھے، میرے والدین کو اور مومنوں کو اس دن معاف فرما جب حساب قائم ہوگا۔',
     source:'Quran 14:41', ayat:true}
  ],
  dhikr: [
    {title:'Ayat al-Kursi — Verse of the Throne', occ:'After every fard prayer and morning/evening',
     arabic:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',
     trans:'Allāhu lā ilāha illā huw, al-ḥayyu al-qayyūm, lā taʾkhudhuhū sinatun wa lā nawm…',
     english:'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth… And He is the Most High, the Most Great.',
     urdu:'اللہ — اس کے سوا کوئی معبود نہیں، ہمیشہ زندہ، سب کو تھامنے والا۔ اسے نہ اونگھ آتی ہے نہ نیند۔ آسمانوں اور زمین میں جو کچھ ہے سب اسی کا ہے… اور وہ بلند و بزرگ ہے۔',
     source:'Quran 2:255 — "Whoever recites Ayat al-Kursi after every obligatory prayer, nothing stands between him and entering Jannah except death." — Nasa\'i', ayat:true},
    {title:'Subhanallah / Alhamdulillah / Allahu Akbar', occ:'After every prayer, 33 times each',
     arabic:'سُبْحَانَ اللَّهِ ٣٣ × \nاَلْحَمْدُ لِلَّهِ ٣٣ × \nاَللَّهُ أَكْبَرُ ٣٣ ×\nلَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
     trans:'Subḥānallāh (×33), Alḥamdulillāh (×33), Allāhu akbar (×33), then: Lā ilāha illallāhu waḥdah…',
     english:'Glory be to Allah (×33), All praise is for Allah (×33), Allah is the Greatest (×33), then: None has the right to be worshipped but Allah alone, without partner. To Him belongs dominion and praise, and He is over all things competent.',
     urdu:'اللہ پاک ہے (٣٣ بار)، سب تعریف اللہ کے لیے ہے (٣٣ بار)، اللہ سب سے بڑا ہے (٣٣ بار)، پھر: اللہ کے سوا کوئی معبود نہیں، اکیلا، بے شریک…',
     source:'Muslim 597', ayat:false},
    {title:'Surah Al-Ikhlas × 3', occ:'Morning, evening, after Fajr & Maghrib',
     arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ ۞ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ',
     trans:'Qul huwa Allāhu aḥad, Allāhu ṣ-ṣamad, lam yalid wa lam yūlad, wa lam yakun lahū kufuwan aḥad',
     english:'Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born. Nor is there to Him any equivalent.',
     urdu:'کہو: وہ اللہ ایک ہے۔ اللہ بے نیاز ہے۔ نہ اس کی اولاد ہے نہ وہ کسی کی اولاد ہے۔ اور نہ کوئی اس کا ہم سر ہے۔',
     source:'Quran 112 — Equals 1/3 of the Quran in reward (Bukhari)', ayat:true},
    {title:'Last Two Verses of Al-Baqarah', occ:'Before sleeping every night',
     arabic:'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ',
     trans:'Āmanar-rasūlu bimā unzila ilayhi mir Rabbihī wal-muʾminūn…',
     english:'The Messenger has believed in what was revealed to him from his Lord, and so have the believers — all of them believe in Allah, His angels, His books and His messengers… "We hear and we obey. Grant us Your forgiveness, our Lord, and to You is the final destination."',
     urdu:'رسول نے مانا جو اتارا گیا اپنے رب کی طرف سے اور مومنوں نے بھی — سب اللہ، فرشتوں، کتابوں اور رسولوں پر ایمان لائے… کہا: ہم نے سنا اور مانا، اے ہمارے رب تیری بخشش ہو اور تیری ہی طرف لوٹنا ہے۔',
     source:'Quran 2:285–286 — "Whoever recites the last two verses of Surah Baqarah at night, they will suffice him." — Bukhari', ayat:true},
    {title:'Istighfar — Seek Forgiveness', occ:'100 times daily, especially at Hajj',

  general: [
    {title:'Dua for Good in Dunya & Akhirah', occ:'Most comprehensive dua in the Quran — say often',
     arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',

    {title:'Dua for Guidance & Steadfastness', occ:'Especially powerful to recite after prayers',

     trans:'Rabbanā lā tuzigh qulūbanā baʿda idh hadaytanā wa hab lanā min ladunka raḥmah, innaka antal-wahhāb',

     source:'Quran 3:8', ayat:true},
    {title:'Dua for Health & Wellbeing', occ:'For yourself, family and Ummah',
     arabic:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',
     trans:'Allāhumma ʿāfinī fī badanī, Allāhumma ʿāfinī fī samʿī, Allāhumma ʿāfinī fī baṣarī, lā ilāha illā ant',
     english:'O Allah, grant me health in my body. O Allah, grant me health in my hearing. O Allah, grant me health in my sight. There is no god but You.',
     urdu:'اے اللہ! مجھے میرے جسم میں عافیت دے۔ اے اللہ! مجھے میری سماعت میں عافیت دے۔ اے اللہ! مجھے میری بصارت میں عافیت دے۔ تیرے سوا کوئی معبود نہیں۔',
     source:'Abu Dawud 5090', ayat:false},
    {title:'Dua for Acceptance of Hajj', occ:'After all rituals are complete',
     arabic:'اللَّهُمَّ تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ',

  dua_arafah: [
  // ── Morning Adhkar ────────────────────────────────────────────
  {title:'Morning — Sovereignty Declaration', occ:'First words each morning — said once',
   arabic:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
   trans:'Asbaḥnā wa asbaḥal-mulku lillāh, wal-ḥamdu lillāh, lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu wa huwa ʿalā kulli shayʾin qadīr',
   english:'We have entered the morning and sovereignty belongs to Allah. All praise is for Allah. There is no deity but Allah alone — to Him belongs sovereignty and praise, and He is over all things competent.',
   urdu:'ہم نے صبح کی اور بادشاہی اللہ کے لیے ہے۔ تعریف اللہ کے لیے۔ اللہ کے سوا کوئی معبود نہیں — اسی کی بادشاہی، اسی کی تعریف، وہ ہر چیز پر قادر ہے۔',
   source:'Abu Dawud 5076, Muslim 2723', ayat:false},
  {title:'Morning — Protection Dua × 3', occ:'Said three times in the morning',
   arabic:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',
   trans:'Allāhumma bika aṣbaḥnā wa bika amsaynā wa bika naḥyā wa bika namūtu wa ilaykan-nushūr',
   english:'O Allah, by You we entered the morning, by You we enter the evening, by You we live, by You we die, and to You is the resurrection.',
   urdu:'اے اللہ! تیری مدد سے صبح کی، تیری مدد سے شام کی، تیری مدد سے جیتے ہیں، تیری مدد سے مرتے ہیں اور تیری ہی طرف اٹھنا ہے۔',
   source:'Abu Dawud 5068, Tirmidhi 3391', ayat:false},
  {title:'Sayyid al-Istighfar — Master of Forgiveness', occ:'Morning and evening — greatest dua for forgiveness',
   arabic:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
   trans:'Allāhumma anta Rabbī lā ilāha illā ant, khalaqtanī wa anā ʿabduk, wa anā ʿalā ʿahdika wa waʿdika mastaṭaʿt, aʿūdhu bika min sharri mā ṣanaʿt, abūʾu laka biniʿmatika ʿalayy, wa abūʾu bidhambī, faghfir lī fa-innahū lā yaghfiru adh-dhunūba illā ant',
   english:'O Allah, You are my Lord. There is no deity but You. You created me and I am Your slave. I am upon Your covenant as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessings and my sin — forgive me, for none forgives sins except You.',
   urdu:'اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں۔ جتنا ہو سکے تیرے عہد پر قائم ہوں۔ اپنے کیے کی برائی سے پناہ مانگتا ہوں، تیری نعمتوں کا اور اپنے گناہوں کا اقرار کرتا ہوں — مجھے معاف کر، تیرے سوا کوئی گناہ نہیں معاف کرتا۔',
   source:'Bukhari 6306 — "Whoever says this with certainty and dies before evening enters Jannah."', ayat:false},
  {title:'Morning — Tasbeeh and Tahmeed', occ:'Morning — 33 times each',
   arabic:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',
   trans:'Subḥānallāhi wa biḥamdih',
   english:'Glory be to Allah and praise be to Him.',
   urdu:'اللہ پاک ہے اور اس کی تعریف ہے۔',
   source:'Bukhari 6405, Muslim 2691 — "sins forgiven even if like sea foam"', ayat:false},
  {title:'Morning — Bismillah Protection × 3', occ:'Said 3 times morning — nothing will harm you',
   arabic:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
   trans:'Bismillāhil-ladhī lā yaḍurru maʿasmihi shayʾun fil-arḍi wa lā fis-samāʾi wa huwas-samīʿul-ʿalīm',
   english:'In the name of Allah with Whose name nothing on earth or in the heavens can cause harm — He is the All-Hearing, All-Knowing.',
   urdu:'اللہ کے نام سے جس کے نام کے ساتھ زمین و آسمان میں کوئی چیز نقصان نہیں پہنچا سکتی — وہ سننے والا، جاننے والا ہے۔',
   source:'Abu Dawud 5088, Tirmidhi 3388', ayat:false},
  {title:'Hasbiyallāh × 7 — Morning and Evening', occ:'Morning and evening — said 7 times',
   arabic:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',
   trans:'Ḥasbiyallāhu lā ilāha illā huw, ʿalayhi tawakkaltu wa huwa Rabbul-ʿarshil-ʿaẓīm',
   english:'Allah is sufficient for me. There is no deity but Him. I place my trust in Him alone, and He is the Lord of the Mighty Throne.',
   urdu:'میرے لیے اللہ کافی ہے۔ اس کے سوا کوئی معبود نہیں۔ میں نے اسی پر بھروسہ کیا اور وہ عرش عظیم کا رب ہے۔',
   source:'Abu Dawud 5081 — "Allah will suffice whoever says this 7× morning and evening"', ayat:false},
  {title:'Āyat al-Kursī — Throne Verse', occ:'After every fard prayer and before sleeping',
   arabic:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',
   trans:'Allāhu lā ilāha illā huw, al-ḥayyul-qayyūm, lā taʾkhudhuhū sinatun wa lā nawm, lahū mā fis-samāwāti wa mā fil-arḍ…',
   english:'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. (Full verse: 2:255)',
   urdu:'اللہ — اس کے سوا کوئی معبود نہیں، ہمیشہ زندہ، قائم رکھنے والا۔ اسے نہ اونگھ آتی ہے نہ نیند۔ آسمانوں اور زمین میں جو کچھ ہے سب اسی کا ہے۔ (پوری آیت: 2:255)',
   source:'Quran 2:255 — "Whoever recites after every fard prayer, nothing stands between him and Jannah but death." — Nasai', ayat:true},
  {title:'Seeking Refuge from Shaytan — Morning', occ:'Morning — 3 times',
   arabic:'أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ',
   trans:'Aʿūdhu billāhis-samīʿil-ʿalīmi minash-shayṭānir-rajīm, min hamzihī wa nafkhihī wa nafthih',
   english:'I seek refuge in Allah, the All-Hearing, All-Knowing, from the accursed Shaytan — from his evil whispers, his puffing up, and his spitting.',
   urdu:'میں اللہ سمیع علیم کی پناہ لیتا ہوں شیطان مردود سے — اس کے وسوسوں، اس کے تکبر اور اس کے جادو سے۔',
   source:'Abu Dawud 775, Tirmidhi 3392', ayat:false},
  {title:'Morning — Complete Sovereignty & Praise', occ:'Morning — full declaration',
   arabic:'أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ وَعَلَى كَلِمَةِ الْإِخْلَاصِ وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا',
   trans:'Asbaḥnā ʿalā fiṭratil-islāmi wa ʿalā kalimatil-ikhlāṣi wa ʿalā dīni nabiyyinā Muḥammadin wa ʿalā millati abīnā Ibrāhīma ḥanīfan muslimā',
   english:'We have entered the morning upon the fitrah of Islam, the word of sincerity, the religion of our Prophet Muhammad, and the way of our father Ibrahim — a monotheist, a Muslim.',
   urdu:'ہم نے صبح کی اسلام کی فطرت پر، اخلاص کے کلمے پر، نبی محمدﷺ کے دین پر اور ابراہیم ؑ کی ملت پر — یک سو، مسلمان۔',
   source:'Ahmad 3/406, Nasai', ayat:false},
  {title:'Morning — Seeking Good of the Day', occ:'Morning supplication for the day ahead',
   arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ',
   trans:'Allāhumma innī asʾaluka khayra hādhal-yawmi fatḥahū wa naṣrahū wa nūrahū wa barakatahū wa hudāh',
   english:'O Allah, I ask You for the good of this day — its opening, its victory, its light, its blessing, and its guidance.',
   urdu:'اے اللہ! اس دن کی بھلائی مانگتا ہوں — اس کی فتح، نصرت، نور، برکت اور ہدایت۔',
   source:'Abu Dawud 5084', ayat:false},

   arabic:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',

  {title:'Dua of Yunus ﷺ — Dua Yunus', occ:'In any distress — the dua from the whale',
   arabic:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',
   trans:'Lā ilāha illā anta subḥānaka innī kuntu minaẓ-ẓālimīn',
   english:'There is no deity except You; glory be to You! Indeed, I have been among the wrongdoers.',
   urdu:'تیرے سوا کوئی معبود نہیں، تو پاک ہے — بے شک میں ظالموں میں سے تھا۔',
   source:'Quran 21:87 — "No Muslim calls with this but that Allah responds." — Tirmidhi 3505', ayat:true},
  {title:'Dua of Adam ﷺ — Rabbanā ẓalamnā', occ:'Seeking forgiveness for sins',
   arabic:'رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ',
   trans:'Rabbanā ẓalamnā anfusanā wa in lam taghfir lanā wa tarḥamnā la-nakūnanna minal-khāsirīn',
   english:'Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.',
   urdu:'اے ہمارے رب! ہم نے اپنے آپ پر ظلم کیا، اگر تو ہمیں نہ بخشے اور رحم نہ کرے تو ہم بربادوں میں سے ہو جائیں گے۔',
   source:'Quran 7:23', ayat:true},
  {title:'Istighfar after Prayer — 3 times', occ:'After completing salah',
   arabic:'أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ',
   trans:'Astaghfirullāhal-ladhī lā ilāha illā huwal-ḥayyul-qayyūmu wa atūbu ilayh',
   english:'I seek forgiveness from Allah, there is no deity except Him, the Ever-Living, the Sustainer, and I repent to Him.',
   urdu:'میں اللہ سے مغفرت مانگتا ہوں — اس کے سوا کوئی معبود نہیں، ہمیشہ زندہ، قائم رکھنے والا — اور اس کی طرف توبہ کرتا ہوں۔',
   source:'Abu Dawud 1517, Tirmidhi 300', ayat:false},

  {title:'Lā ilāha illallāh — Best Dhikr', occ:'The best remembrance — say abundantly at Arafah',
   arabic:'لَا إِلَهَ إِلَّا اللَّهُ',

  {title:'Lā ḥawla wa lā quwwata — Treasure of Paradise', occ:'At all times — treasure of Jannah',

  {title:'Four Praised Phrases', occ:'Most beloved words to Allah — say frequently',
   arabic:'سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ',

  // ── Quranic Duas ─────────────────────────────────────────────
  {title:'Al-Fātiḥah', occ:'Recite for any need — the greatest opening dua',
   arabic:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الرَّحْمَٰنِ الرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',
   trans:'Alḥamdu lillāhi Rabbil-ʿālamīn, Ar-Raḥmānir-Raḥīm, Māliki yawmid-dīn, iyyāka naʿbudu wa iyyāka nastaʿīn, ihdinaṣ-ṣirāṭal-mustaqīm',
   english:'Praise be to Allah, Lord of all worlds, the Most Gracious, the Most Merciful, Master of the Day of Judgement. You alone we worship and You alone we ask for help. Guide us to the straight path.',
   urdu:'تعریف اللہ کے لیے جو تمام جہانوں کا رب ہے، بے حد مہربان، رحم والا، روز جزا کا مالک۔ تیری ہی عبادت کرتے ہیں، تجھی سے مدد مانگتے ہیں۔ ہمیں سیدھی راہ دکھا۔',
   source:'Quran 1:1-7 — the greatest surah; use as ruqyah and dua', ayat:true},
  {title:'Rabbanā ātinā — Provision in Both Worlds', occ:'The most comprehensive Quranic dua',
   arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',
   trans:'Rabbanā ātinā fid-dunyā ḥasanatan wa fil-ākhirati ḥasanatan wa qinā ʿadhābannār',
   english:'Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.',
   urdu:'اے ہمارے رب! ہمیں دنیا میں بھی بھلائی دے اور آخرت میں بھی بھلائی دے اور ہمیں آگ کے عذاب سے بچا۔',
   source:'Quran 2:201 — "The Prophet ﷺ made dua with this most often." — Bukhari', ayat:true},
  {title:'Rabbish-raḥ — Dua of Musa ﷺ', occ:'Before any speech or difficult task',
   arabic:'رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي',
   trans:'Rabbish-raḥ lī ṣadrī wa yassir lī amrī waḥlul ʿuqdatan min lisānī yafqahū qawlī',
   english:'My Lord, expand my chest, ease my task for me, and untie the knot from my tongue so they may understand my speech.',
   urdu:'اے میرے رب! میرا سینہ کھول دے، میرا کام آسان کر اور میری زبان کی گرہ کھول تاکہ لوگ میری بات سمجھیں۔',
   source:'Quran 20:25-28 — dua of Musa ﷺ when sent to Pharaoh', ayat:true},
  {title:'Rabbi inni limā — Dua of Musa ﷺ in Need', occ:'When in need of anything — complete trust',
   arabic:'رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ',
   trans:'Rabbi innī limā anzalta ilayya min khayrin faqīr',
   english:'My Lord, indeed I am in need of whatever good You send down to me.',
   urdu:'اے میرے رب! بے شک میں تیری طرف سے نازل ہونے والی ہر بھلائی کا محتاج ہوں۔',
   source:'Quran 28:24 — Musa ﷺ said this with nothing; Allah provided swiftly', ayat:true},
  {title:'Rabbanā ẓalamnā — Dua of Adam ﷺ', occ:'Admitting wrongdoing and seeking mercy',

   trans:'Rabbanā ẓalamnā anfusanā wa in lam taghfir lanā wa tarḥamnā la-nakūnanna minal-khāsirīn',
   english:'Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.',
   urdu:'اے ہمارے رب! ہم نے اپنے آپ پر ظلم کیا — اگر تو نہ بخشے اور رحم نہ کرے تو ہم بربادوں میں سے ہو جائیں گے۔',
   source:'Quran 7:23 — dua of Adam and Hawwa ﷻ', ayat:true},
  {title:'Rabbi zidni ʿilmā — Increase in Knowledge', occ:'Before studying; for understanding of deen',
   arabic:'رَبِّ زِدْنِي عِلْمًا',
   trans:'Rabbi zidnī ʿilmā',
   english:'My Lord, increase me in knowledge.',
   urdu:'اے میرے رب! مجھے علم میں اضافہ فرما۔',
   source:'Quran 20:114', ayat:true},
  {title:'Rabbanā hab lanā — Dua of the Pious', occ:'For righteous spouse and children',
   arabic:'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا',
   trans:'Rabbanā hab lanā min azwājinā wa dhurriyyātinā qurrata aʿyunin wajʿalnā lil-muttaqīna imāmā',
   english:'Our Lord, grant us from our spouses and offspring comfort to our eyes and make us an example for the righteous.',
   urdu:'اے ہمارے رب! ہمیں ہماری بیویوں اور اولاد کی طرف سے آنکھوں کی ٹھنڈک عطا فرما اور ہمیں متقیوں کا امام بنا۔',
   source:'Quran 25:74', ayat:true},
  {title:'Rabbighfir li-wālidayya — Dua for Parents', occ:'For one\'s parents — living or deceased',
   arabic:'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',
   trans:'Rabbighfir lī wa li-wālidayya, Rabbir-ḥamhumā kamā rabbayānī ṣaghīrā',
   english:'My Lord, forgive me and my parents. My Lord, have mercy on them as they raised me when I was young.',
   urdu:'اے میرے رب! مجھے اور میرے والدین کو بخش دے۔ اے میرے رب! ان پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔',
   source:'Quran 17:24', ayat:true},
  {title:'Dua of Ayyub ﷺ — In Illness and Hardship', occ:'Prolonged illness, affliction, hardship',
   arabic:'رَبِّ إِنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ',
   trans:'Rabbi innī massaniyaḍ-ḍurru wa anta arḥamur-rāḥimīn',
   english:'My Lord, affliction has touched me and You are the Most Merciful of the merciful.',
   urdu:'اے میرے رب! مجھے تکلیف پہنچی ہے اور تو سب رحم کرنے والوں میں سب سے رحم کرنے والا ہے۔',
   source:'Quran 21:83 — Allah responded and lifted his affliction', ayat:true},
  {title:'Dua of Sulayman ﷺ — Gratitude for Blessings', occ:'Upon receiving great blessings or success',
   arabic:'رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ',
   trans:'Rabbi awziʿnī an ashkura niʿmatakallati anʿamta ʿalayya wa ʿalā wālidayya wa an aʿmala ṣāliḥan tarḍāhu wa adkhilnī biraḥmatika fī ʿibādikaṣ-ṣāliḥīn',
   english:'My Lord, enable me to be grateful for Your favour upon me and upon my parents, and to do righteousness of which You approve, and admit me by Your mercy into Your righteous servants.',
   urdu:'اے میرے رب! مجھے توفیق دے کہ تیری نعمت کا شکر ادا کروں جو تو نے مجھ پر اور میرے والدین پر فرمائی، اور ایسا نیک عمل کروں جو تجھے پسند ہو، اور مجھے رحمت سے نیک بندوں میں شامل کر۔',
   source:'Quran 27:19', ayat:true},
  // ── Protection ────────────────────────────────────────────────
  {title:'Three Quls — Morning and Evening × 3', occ:'Said 3 times each morning and evening',
   arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ — قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ — قُلْ أَعُوذُ بِرَبِّ النَّاسِ',
   trans:'Qul huwallāhu aḥad — Qul aʿūdhu bi-Rabbil-falaq — Qul aʿūdhu bi-Rabbin-nās',
   english:'Recite Sūrah al-Ikhlāṣ, al-Falaq, and an-Nās — 3 times each morning and evening. They suffice you against everything.',
   urdu:'سورۃ الاخلاص، سورۃ الفلق اور سورۃ الناس — صبح و شام تین تین بار۔ یہ ہر چیز سے کافی ہیں۔',
   source:'Abu Dawud 5082, Tirmidhi 3575', ayat:false},
  {title:'Protection from Evil Eye', occ:'For yourself or children — recite and blow',
   arabic:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ',
   trans:'Aʿūdhu bikalimātillāhit-tāmmati min kulli shayṭānin wa hāmmatin wa min kulli ʿaynin lāmmah',
   english:'I seek refuge in the perfect words of Allah from every devil, every poisonous creature, and from every evil eye.',
   urdu:'اللہ کے کامل کلمات کی پناہ لیتا ہوں ہر شیطان، ہر زہریلے جانور اور ہر بری نظر سے۔',
   source:'Bukhari 3371 — the Prophet ﷺ used this for Hasan and Husayn', ayat:false},
  {title:'Refuge from Four Evils', occ:'Daily protection from major harms',
   arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ وَمِنْ سَيِّئِ الْأَسْقَامِ',
   trans:'Allāhumma innī aʿūdhu bika minal-baraṣi wal-junūni wal-judhāmi wa min sayyi-ʾil-asqām',
   english:'O Allah, I seek Your refuge from leprosy, madness, elephantiasis, and from evil diseases.',
   urdu:'اے اللہ! برص، پاگل پن، کوڑھ اور بری بیماریوں سے تیری پناہ مانگتا ہوں۔',
   source:'Abu Dawud 1554', ayat:false},
  {title:'Dua of Distress — Lā ilāha illallāh al-ʿAẓīm', occ:'When severely distressed',
   arabic:'لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ',
   trans:'Lā ilāha illallāhul-ʿaẓīmul-ḥalīm, lā ilāha illallāhu Rabbul-ʿarshil-ʿaẓīm, lā ilāha illallāhu Rabbus-samāwāti wa Rabbul-arḍi wa Rabbul-ʿarshil-karīm',
   english:'There is no deity except Allah, the Almighty, the Forbearing. There is no deity except Allah, Lord of the Mighty Throne. There is no deity except Allah, Lord of the heavens, Lord of the earth, and Lord of the Noble Throne.',
   urdu:'اللہ کے سوا کوئی معبود نہیں — بزرگ، بردبار۔ اللہ کے سوا کوئی معبود نہیں — عرش عظیم کا رب۔ اللہ کے سوا کوئی معبود نہیں — آسمانوں کا رب، زمین کا رب اور عرش کریم کا رب۔',
   source:'Bukhari 6346, Muslim 2730', ayat:false},
  {title:'Kafayatullah — Allah Suffices', occ:'In hardship, when feeling helpless',

   trans:'Ḥasbunallāhu wa niʿmal-wakīl',
   english:'Sufficient for us is Allah, and He is the best Disposer of affairs.',
   urdu:'ہمارے لیے اللہ کافی ہے اور وہ بہترین کارساز ہے۔',
   source:'Quran 3:173 / Bukhari 4563 — words of Ibrahim ﷺ when cast into fire', ayat:true},

  {title:'Dua for Offspring', occ:'For righteous children — dua of Zakariyya ﷺ',

  {title:'Forgiveness for All Muslims', occ:'Pray for the Ummah at Arafah',

  {title:'Dua for Lawful Provision', occ:'Asking for halal and sufficient rizq',
   arabic:'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ',
   trans:'Allāhummak-finī biḥalālika ʿan ḥarāmik wa aghnini bifaḍlika ʿamman siwāk',
   english:'O Allah, suffice me with what You have made lawful so I need not resort to the forbidden, and enrich me by Your grace so I need no one other than You.',
   urdu:'اے اللہ! حلال سے کافی کر دے کہ حرام کی ضرورت نہ پڑے اور اپنے فضل سے غنی بنا دے کہ تیرے سوا کسی کا محتاج نہ رہوں۔',
   source:'Tirmidhi 3563', ayat:false},
  {title:'Yā Ḥayyu yā Qayyūm — Tawakkul', occ:'In need; when feeling helpless',
   arabic:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ',
   trans:'Yā Ḥayyu yā Qayyūmu biraḥmatika astaghīth, aṣliḥ lī shaʾnī kullahū wa lā takilnī ilā nafsī ṭarfata ʿayn',
   english:'O Ever-Living, O Sustainer, in Your mercy I seek help. Rectify all my affairs and do not leave me to myself for the blink of an eye.',
   urdu:'اے ہمیشہ زندہ، اے قائم رکھنے والے — تیری رحمت سے فریاد کرتا ہوں۔ میرے سارے معاملات درست فرما اور ایک پل کے لیے بھی مجھے میرے نفس کے حوالے نہ کرنا۔',

const CATS = [
  {id:'travel',      label:'✈️ Travel'},
  {id:'madinah',     label:'🕌 Madinah'},
  {id:'umrah',       label:'🕋 Umrah'},
  {id:'arafat',      label:'🌅 Arafat'},
  {id:'dhikr',       label:'📿 Adhkar'},
  {id:'general',     label:'🤲 General'},
  {id:'dua_arafah',  label:'🌄 Dua for Arafah'}
];

// ── App State ──────────────────────────────────────────────────
let currentTab = 'journey';
let selectedCat = 'travel';
let familyDuas = JSON.parse(localStorage.getItem('hajj-family') || '[]');

// ── Countdown ──────────────────────────────────────────────────
function renderTodayBanner() {
  const now = new Date();
  const arafat = new Date('2026-05-26');
  const madinah = new Date('2026-05-16');
  const eid = new Date('2026-05-27');
  const startDay = new Date(now); startDay.setHours(0,0,0,0);
  const diff = d => Math.ceil((d - startDay) / 86400000);
  const dA = diff(arafat), dM = diff(madinah), dE = diff(eid);

  let title = 'May Allah accept your Hajj', sub = 'Hajj Mabrur, inshāAllah';
  if (dM > 0) { title = `${dM} day${dM>1?'s':''} until Madinah`; sub = 'May 16 — Journey begins'; }
  else if (dA > 0 && dM <= 0) { title = `${dA} day${dA>1?'s':''} until Arafat`; sub = 'The greatest day of Hajj'; }
  else if (dE === 0) { title = 'Eid Mubarak! 🌙'; sub = 'Today: Rami · Qurbani · Halq · Tawaf Ifadha'; }
  else if (dA === 0) { title = 'Today is Yawm Arafah!'; sub = 'Stand at Arafat — make all your duas'; }

  const boxes = dM > 0
    ? [{n:dM,l:'Madinah'},{n:diff(new Date('2026-05-18')),l:'Umrah'},{n:dA,l:'Arafat'},{n:dE,l:'Eid'}]
    : [{n:Math.max(0,dA),l:'Arafat'},{n:Math.max(0,dE),l:'Eid'},{n:Math.max(0,diff(new Date('2026-05-25'))),l:'Mina'},{n:Math.max(0,diff(new Date('2026-05-29'))),l:'Nafr'}];

  document.getElementById('todayBanner').innerHTML = `
    <div class="today-label">Today · ${now.toLocaleDateString('en',{month:'long',day:'numeric',year:'numeric'})}</div>
    <div class="today-title">${title}</div>
    <div class="today-sub">${sub}</div>
    <div class="counts">${boxes.map(b=>`<div class="cbox"><div class="cnum">${b.n}</div><div class="clbl">${b.l}</div></div>`).join('')}</div>`;
}

// ── Journey ────────────────────────────────────────────────────
function renderJourney() {
  const now = new Date(); now.setHours(0,0,0,0);
  const html = JOURNEY.map(d => {
    const fd = new Date(d.full);
    const isToday = fd.getTime() === now.getTime();
    const isPast  = fd < now;
    const dotCls  = isToday ? 'ddot today-dot' : isPast ? 'ddot past' : 'ddot';
    const badge   = d.badge ? `<span class="dbadge ${d.badgeClass}">${d.badge}</span>` : '';
    const steps   = d.steps.map(s => {
      let duaBlock = '';
      if (s.arabic) {
        duaBlock = `<div class="sarabic">${s.arabic}</div>`;
        if (s.trans)   duaBlock += `<div class="strans">${s.trans}</div>`;
        if (s.english) duaBlock += `<div class="senglish">${s.english}</div>`;
        if (s.urdu)    duaBlock += `<div class="surdu">${s.urdu}</div>`;
        if (s.source)  duaBlock += `<div class="ssource">— ${s.source}</div>`;
      }
      const noteBlock = s.note ? `<div class="snote">${s.note}</div>` : '';
      const descBlock = s.desc ? `<div class="sdesc">${s.desc}</div>` : '';
      return `<div class="step">
        <div class="sico">${s.ico||'📌'}</div>
        <div class="sbody">
          <div class="stitle">${s.title}</div>
          ${descBlock}${duaBlock}${noteBlock}
        </div></div>`;
    }).join('');
    return `<div class="dcard glass${isToday?' glass-gold':''}" id="${d.id}">
      <div class="dhdr" onclick="toggleDay('${d.id}')">
        <div class="${dotCls}">${d.icon}</div>
        <div class="dinfo">
          <div class="dname">${d.date} · ${d.day}</div>
          <div class="dmeta">${d.hijri} · ${d.location}</div>
        </div>
        ${badge}
        <div class="dchev">›</div>
      </div>
      <div class="dsteps">${steps}</div>
    </div>`;
  }).join('');
  document.getElementById('journeyList').innerHTML = html;
  // auto-open today
  const todayEl = JOURNEY.find(d => new Date(d.full).setHours(0,0,0,0) === now.getTime());
  if (todayEl) toggleDay(todayEl.id, true);
}

function toggleDay(id, forceOpen) {
  const el = document.getElementById(id);
  if (forceOpen) el.classList.add('open');
  else el.classList.toggle('open');
}

// ── Family Duas ────────────────────────────────────────────────
function saveFamily() { localStorage.setItem('hajj-family', JSON.stringify(familyDuas)); }

function addFamily() {
  const name = document.getElementById('fname').value.trim();
  const rel  = document.getElementById('frelation').value.trim();
  const dua  = document.getElementById('fduareq').value.trim();
  if (!name || !dua) return;
  familyDuas.unshift({id: Date.now(), name, rel, dua, done: false});
  saveFamily();
  document.getElementById('fname').value = '';
  document.getElementById('frelation').value = '';
  document.getElementById('fduareq').value = '';
  renderFamily();
}

function toggleFamilyDone(id) {
  const f = familyDuas.find(x => x.id === id);
  if (f) { f.done = !f.done; saveFamily(); renderFamily(); }
}

function deleteFamily(id) {
  familyDuas = familyDuas.filter(x => x.id !== id);
  saveFamily(); renderFamily();
}

function renderFamily() {
  const grid = document.getElementById('familyGrid');
  if (!familyDuas.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-ico">🤲</div>Add your family members above.<br>Their duas will be remembered in your Hajj.</div>`;
    return;
  }
  grid.innerHTML = `<div class="fgrid">${familyDuas.map(f => `
    <div class="fcard glass${f.done?' glass-green':''}">
      <div class="fname">
        <span>${f.name}${f.rel?` <span style="font-weight:400;opacity:0.6;font-size:11px">(${f.rel})</span>`:''}</span>
        <button class="fcheck${f.done?' done':''}" onclick="toggleFamilyDone(${f.id})">${f.done?'✓':''}</button>
      </div>
      <div class="fdua">${f.dua}</div>
      <button class="fdel" onclick="deleteFamily(${f.id})">✕ remove</button>
    </div>`).join('')}</div>`;
}

// ── Adhkar ─────────────────────────────────────────────────────
function renderCatPills() {
  document.getElementById('catPills').innerHTML = CATS.map(c =>
    `<button class="pill${c.id===selectedCat?' active':''}" onclick="selectCat('${c.id}')">${c.label}</button>`
  ).join('');
}

function selectCat(id) {
  selectedCat = id;
  renderCatPills();
  renderDuas();
}

function renderDuas() {
  const list = DUAS_DATA[selectedCat] || [];
  document.getElementById('duaList').innerHTML = list.map(d => `
    <div class="duacard glass${d.ayat?' ayatcard':''}">
      <div class="dtitle">${d.title}</div>
      <div class="docc">${d.occ}</div>
      <div class="darabic">${d.arabic}</div>
      ${d.trans ? `<div class="dtrans">${d.trans}</div>` : ''}
      <div class="denglish">${d.english}</div>
      ${d.urdu ? `<div class="durdu">${d.urdu}</div>` : ''}
      <div class="dsource">— ${d.source}</div>
    </div>`).join('');
}

// ── Tab Switching ──────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  currentTab = tab;
}

// ── Init ───────────────────────────────────────────────────────
renderTodayBanner();
renderJourney();
renderFamily();
renderCatPills();
renderDuas();
</script>
</body>
</html>
