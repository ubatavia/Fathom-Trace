   title:'Ruqyah — Healing with Quran',
   occ:'Recite over water, then drink, or blow on the sick person',
   arabic:'بِسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنٍ أَوْ حَاسِدٍ اللَّهُ يَشْفِيكَ بِسْمِ اللَّهِ أَرْقِيكَ',
   trans:'Bismillāhi arqīka min kulli shayʾin yuʾdhīka, min sharri kulli nafsin aw ʿaynin aw ḥāsidin, Allāhu yashfīka, bismillāhi arqīk',
   english:'In the name of Allah I perform ruqyah for you from everything that harms you, from the evil of every soul or eye or envier. May Allah heal you. In the name of Allah I perform ruqyah for you.',
   urdu:'اللہ کے نام سے میں تمہارا دم کرتا ہوں ہر اس چیز سے جو تمہیں تکلیف دے — ہر نفس، نظر یا حسد کی برائی سے۔ اللہ تمہیں شفا دے۔ اللہ کے نام سے دم کرتا ہوں۔',
   source:'Muslim 2186'},
  {id:94,cats:['health'],icon:'💚',ayat:false,
   title:'Dua for the sick (from visitor)',
   occ:'Said by someone visiting the sick — 7 times',
   arabic:'أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ',
   trans:'Asʾalullāhal-ʿaẓīma Rabbal-ʿarshil-ʿaẓīmi an yashfiyak',
   english:'I ask Allah the Almighty, Lord of the Mighty Throne, to cure you.',
   urdu:'میں اللہ عظیم سے، عرش عظیم کے رب سے، تیری شفا مانگتا ہوں۔',
   source:'Abu Dawud 3106, Tirmidhi 2083'},
  {id:95,cats:['health'],icon:'💚',ayat:false,
   title:'When in pain — hand on the area',
   occ:'Place right hand on area of pain and say 7 times',
   arabic:'أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ',
   trans:'Aʿūdhu billāhi wa qudratihī min sharri mā ajidu wa uḥādhir',
   english:'I seek refuge in Allah and His power from the evil of what I feel and what I fear.',
   urdu:'اللہ اور اس کی قدرت کی پناہ لیتا ہوں اس تکلیف کی برائی سے جو میں محسوس کرتا ہوں اور جس سے ڈرتا ہوں۔',
   source:'Muslim 2202'},
  // ══ FAMILY ════════════════════════════════════════════════════════════
  {id:96,cats:['family'],icon:'👨‍👩‍👧',ayat:true,
   title:'Dua for righteous spouse and children',
   occ:'Dua of the believers — for good family',
   arabic:'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا',
   trans:'Rabbanā hab lanā min azwājinā wa dhurriyyātinā qurrata aʿyunin wajʿalnā lil-muttaqīna imāmā',
   english:'Our Lord, grant us from our spouses and offspring comfort to our eyes and make us an example for the righteous.',
   urdu:'اے ہمارے رب! ہمیں ہماری بیویوں اور اولاد کی طرف سے آنکھوں کی ٹھنڈک عطا فرما اور ہمیں پرہیزگاروں کا امام بنا۔',
   source:'Quran 25:74'},
  {id:97,cats:['family'],icon:'👨‍👩‍👧',ayat:true,
   title:'Dua for offspring',
   occ:'Dua of Zakariyya ﷺ — for righteous children',
   arabic:'رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ',
   trans:'Rabbi hab lī milladunka dhurriyyatan ṭayyibah, innaka samīʿud-duʿāʾ',
   english:'My Lord, grant me from Yourself righteous offspring. Indeed, You are the Hearer of supplication.',
   urdu:'اے میرے رب! مجھے اپنی طرف سے پاکیزہ اولاد عطا فرما۔ بے شک تو دعا سننے والا ہے۔',
   source:'Quran 3:38'},
  {id:98,cats:['family'],icon:'👨‍👩‍👧',ayat:false,
   title:'Dua on wedding night',
   occ:'When a man takes his new wife by the forehead and prays',
   arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَمِنْ شَرِّ مَا جَبَلْتَهَا عَلَيْهِ',
   trans:'Allāhumma innī asʾaluka khayrahā wa khayra mā jabaltahā ʿalayh, wa aʿūdhu bika min sharrihā wa min sharri mā jabaltahā ʿalayh',
   english:'O Allah, I ask You for her goodness and the goodness of her nature; and I seek refuge in You from her evil and the evil of her nature.',
   urdu:'اے اللہ! میں اس کی بھلائی اور جس فطرت پر تو نے اسے بنایا اس کی بھلائی مانگتا ہوں، اور اس کی برائی اور اس کی فطرت کی برائی سے پناہ مانگتا ہوں۔',
   source:'Abu Dawud 2160, Ibn Majah 1918'},
  {id:99,cats:['family'],icon:'👨‍👩‍👧',ayat:false,
   title:'Before marital relations',
   occ:'Before intimacy between husband and wife',
   arabic:'بِسْمِ اللَّهِ اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا',
   trans:'Bismillāh, Allāhumma jannibnaash-shayṭāna wa jannibish-shayṭāna mā razaqtanā',
   english:'In the name of Allah. O Allah, keep Shaytan away from us and keep Shaytan away from what You have blessed us with.',
   urdu:'اللہ کے نام سے۔ اے اللہ! ہمیں شیطان سے دور رکھ اور جو تو ہمیں عطا کرے اسے بھی شیطان سے محفوظ رکھ۔',
   source:'Bukhari 141, Muslim 1434'},
  {id:100,cats:['family'],icon:'👨‍👩‍👧',ayat:true,
   title:'Dua for parents',
   occ:'For one\'s parents — living or deceased',
   arabic:'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',
   trans:'Rabbighfir lī wa li-wālidayya, Rabbir-ḥamhumā kamā rabbayānī ṣaghīrā',
   english:'My Lord, forgive me and my parents. My Lord, have mercy on them as they raised me when I was young.',
   urdu:'اے میرے رب! مجھے اور میرے والدین کو بخش دے۔ اے میرے رب! ان پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔',
   source:'Quran 17:24'},
  // ══ FORGIVENESS ═══════════════════════════════════════════════════════
  {id:101,cats:['forgiveness'],icon:'🌿',ayat:false,
   title:'Sayyid al-Istighfar — Master of Forgiveness',
   occ:'Morning and evening — the greatest dua for forgiveness',
   arabic:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
   trans:'Allāhumma anta Rabbī lā ilāha illā ant, khalaqtanī wa anā ʿabduk, wa anā ʿalā ʿahdika wa waʿdika mastaṭaʿt, aʿūdhu bika min sharri mā ṣanaʿt, abūʾu laka biniʿmatika ʿalayy, wa abūʾu bidhambī, faghfir lī fa-innahū lā yaghfiru adh-dhunūba illā ant',
   english:'O Allah, You are my Lord. There is no deity but You. You created me and I am Your slave. I am upon Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessings upon me and acknowledge my sin — so forgive me, for none forgives sins except You.',
   urdu:'اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں۔ جتنا ہو سکے تیرے عہد پر قائم ہوں۔ اپنے کیے کی برائی سے پناہ مانگتا ہوں، تیری نعمتوں کا اور اپنے گناہوں کا اقرار کرتا ہوں — مجھے معاف کر، تیرے سوا کوئی گناہ نہیں معاف کرتا۔',
   source:'Bukhari 6306'},
  {id:102,cats:['forgiveness'],icon:'🌿',ayat:false,
   title:'Istighfar — Simple',
   occ:'Say at least 100 times daily',
   arabic:'أَسْتَغْفِرُ اللَّهَ',
   trans:'Astaghfirullāh',
   english:'I seek forgiveness from Allah.',
   urdu:'میں اللہ سے مغفرت مانگتا ہوں۔',
   source:'Muslim 2702'},
  {id:103,cats:['forgiveness'],icon:'🌿',ayat:false,
   title:'Istighfar with repentance',
   occ:'Seeking forgiveness with return to Allah',
   arabic:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',
   trans:'Astaghfirullāha wa atūbu ilayh',
   english:'I seek forgiveness from Allah and repent to Him.',
   urdu:'میں اللہ سے مغفرت مانگتا ہوں اور اس کی طرف توبہ کرتا ہوں۔',
   source:'Bukhari 6307'},
  {id:104,cats:['forgiveness'],icon:'🌿',ayat:true,
   title:'Dua of Yunus ﷺ — Dua Yunus',
   occ:'In distress, darkness, hardship — the dua of the whale',
   arabic:'لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',
   trans:'Lā ilāha illā anta subḥānaka innī kuntu minaẓ-ẓālimīn',
   english:'There is no deity except You; glory be to You! Indeed, I have been among the wrongdoers.',
   urdu:'تیرے سوا کوئی معبود نہیں، تو پاک ہے — بے شک میں ظالموں میں سے تھا۔',
   source:'Quran 21:87 — "No Muslim calls with this dua but that Allah responds." — Tirmidhi 3505'},
  {id:105,cats:['forgiveness'],icon:'🌿',ayat:true,
   title:'Rabbanā ẓalamnā — Dua of Adam ﷺ',
   occ:'Seeking forgiveness for sins — the dua of Adam and Hawwa',
   arabic:'رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ',
   trans:'Rabbanā ẓalamnā anfusanā wa in lam taghfir lanā wa tarḥamnā la-nakūnanna minal-khāsirīn',
   english:'Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.',
   urdu:'اے ہمارے رب! ہم نے اپنے آپ پر ظلم کیا، اگر تو ہمیں نہ بخشے اور ہم پر رحم نہ کرے تو ہم بربادوں میں سے ہو جائیں گے۔',
   source:'Quran 7:23'},
  {id:106,cats:['forgiveness'],icon:'🌿',ayat:false,
   title:'Istighfar — three times after prayer',
   occ:'After completing salah — said 3 times',
   arabic:'أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ',
   trans:'Astaghfirullāhal-ladhī lā ilāha illā huwal-ḥayyul-qayyūmu wa atūbu ilayh',
   english:'I seek forgiveness from Allah, there is no deity except Him, the Ever-Living, the Sustainer, and I repent to Him.',
   urdu:'میں اللہ سے مغفرت مانگتا ہوں جس کے سوا کوئی معبود نہیں — ہمیشہ زندہ، سب کو سنبھالنے والا — اور میں اس کی طرف توبہ کرتا ہوں۔',
   source:'Abu Dawud 1517, Tirmidhi 300'},
  // ══ PROTECTION ════════════════════════════════════════════════════════
  {id:107,cats:['protection'],icon:'🛡️',ayat:true,
   title:'Āyat al-Kursī — Throne Verse',
   occ:'After every fard prayer and before sleeping — greatest protection',
   arabic:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ',
   trans:'Allāhu lā ilāha illā huw, al-ḥayyul-qayyūm, lā taʾkhudhuhū sinatun wa lā nawm, lahū mā fis-samāwāti wa mā fil-arḍ',
   english:'Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. (Continue through full verse: 2:255)',
   urdu:'اللہ — اس کے سوا کوئی معبود نہیں، ہمیشہ زندہ، قائم رکھنے والا۔ اسے نہ اونگھ آتی ہے نہ نیند۔ آسمانوں اور زمین میں جو کچھ ہے سب اسی کا ہے۔ (پوری آیت: 2:255)',
   source:'Quran 2:255 — "Whoever recites after every fard prayer, nothing stands between him and Jannah but death." — Nasai'},
  {id:108,cats:['protection','morning','evening'],icon:'🛡️',ayat:false,
   title:'Al-Muʿawwidhatayn — Protection duas',
   occ:'Morning and evening — 3 times each',
   arabic:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ … قُلْ أَعُوذُ بِرَبِّ النَّاسِ',
   trans:'Qul aʿūdhu bi-Rabbil-falaq… Qul aʿūdhu bi-Rabbin-nās',
   english:'Recite Sūrah al-Falaq (113) and Sūrah an-Nās (114) — 3 times each morning and evening. They suffice you against everything.',
   urdu:'سورۃ الفلق اور سورۃ الناس — صبح و شام تین تین بار پڑھیں۔ یہ ہر چیز سے کافی ہیں۔',
   source:'Abu Dawud 5082, Tirmidhi 3575'},
  {id:109,cats:['protection'],icon:'🛡️',ayat:false,
   title:'Protection from evil eye (ʿayn)',
   occ:'When you fear the evil eye for yourself or your children',
   arabic:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ',
   trans:'Aʿūdhu bikalimātillāhit-tāmmati min kulli shayṭānin wa hāmmatin wa min kulli ʿaynin lāmmah',
   english:'I seek refuge in the perfect words of Allah from every devil and every poisonous creature and from every evil eye.',
   urdu:'اللہ کے کامل کلمات کی پناہ لیتا ہوں ہر شیطان، ہر زہریلے جانور اور ہر بری نظر سے۔',
   source:'Bukhari 3371 — the Prophet ﷺ used to recite this over Hasan and Husayn'},
  {id:110,cats:['protection'],icon:'🛡️',ayat:false,
   title:'Morning protection — comprehensive',
   occ:'Morning: said 3 times — comprehensive protection',
   arabic:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
   trans:'Bismillāhil-ladhī lā yaḍurru maʿasmihi shayʾun fil-arḍi wa lā fis-samāʾi wa huwas-samīʿul-ʿalīm',
   english:'In the name of Allah with Whose name nothing on earth or in the heavens can cause harm — He is the All-Hearing, All-Knowing.',
   urdu:'اللہ کے نام سے جس کے نام کے ساتھ زمین و آسمان میں کوئی چیز نقصان نہیں پہنچا سکتی — وہ سننے والا، جاننے والا ہے۔',
   source:'Abu Dawud 5088, Tirmidhi 3388 — whoever says this 3× morning and evening, nothing will harm him'},
  {id:111,cats:['protection'],icon:'🛡️',ayat:false,
   title:'Refuge from four things',
   occ:'Dua for protection from major harms — frequent supplication',
   arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ وَمِنْ سَيِّئِ الْأَسْقَامِ',
   trans:'Allāhumma innī aʿūdhu bika minal-baraṣi wal-junūni wal-judhāmi wa min sayyi-ʾil-asqām',
   english:'O Allah, I seek Your refuge from leprosy, madness, elephantiasis, and from evil diseases.',
   urdu:'اے اللہ! میں تجھ سے برص، پاگل پن، کوڑھ اور بری بیماریوں سے پناہ مانگتا ہوں۔',
   source:'Abu Dawud 1554'},
  {id:112,cats:['protection','morning'],icon:'🛡️',ayat:false,
   title:'Hasbiyallāh — Allah is sufficient',
   occ:'Morning and evening — 7 times',
   arabic:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',
   trans:'Ḥasbiyallāhu lā ilāha illā huw, ʿalayhi tawakkaltu wa huwa Rabbul-ʿarshil-ʿaẓīm',
   english:'Allah is sufficient for me. There is no deity but Him. I place my trust in Him alone, and He is the Lord of the Mighty Throne.',
   urdu:'میرے لیے اللہ کافی ہے۔ اس کے سوا کوئی معبود نہیں۔ میں نے اسی پر بھروسہ کیا اور وہ عرش عظیم کا رب ہے۔',
   source:'Abu Dawud 5081 — "Allah will suffice whoever says this 7× morning and evening in whatever concerns him."'},
  // ══ HAJJ / UMRAH ══════════════════════════════════════════════════════
  {id:113,cats:['hajj'],icon:'🕋',ayat:false,
   title:'Talbiyah',
   occ:'During ihram — repeated throughout hajj and umrah',
   arabic:'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ لَا شَرِيكَ لَكَ',
   trans:'Labbayk Allāhumma labbayk, labbayka lā sharīka laka labbayk, innal-ḥamda wan-niʿmata laka wal-mulk, lā sharīka lak',
   english:'Here I am, O Allah, here I am. Here I am — You have no partner — here I am. Verily, all praise, grace and sovereignty belong to You. You have no partner.',
   urdu:'حاضر ہوں اے اللہ، حاضر ہوں۔ حاضر ہوں — تیرا کوئی شریک نہیں — حاضر ہوں۔ بے شک تعریف، نعمت اور بادشاہی سب تیرے لیے ہے۔ تیرا کوئی شریک نہیں۔',
   source:'Bukhari 1549, Muslim 1184'},
  {id:114,cats:['hajj'],icon:'🕋',ayat:false,
   title:'Dua at seeing the Kaʿbah',
   occ:'First sight of the blessed Kaʿbah',
   arabic:'اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً وَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ أَوِ اعْتَمَرَهُ تَشْرِيفًا وَتَكْرِيمًا وَتَعْظِيمًا وَبِرًّا',
   trans:'Allāhumma zid hādhāl-bayta tashrīfan wa taʿẓīman wa takrīman wa mahābatan wa zid man sharrafahū wa karramahū mimman ḥajjahū aw iʿtamarahū tashrīfan wa takrīman wa taʿẓīman wa birrā',
   english:'O Allah, increase this House in honour, greatness, nobility, and awe; and increase in honour, nobility, greatness and righteousness those who honour and revere it from among those who perform Hajj or Umrah.',
   urdu:'اے اللہ! اس گھر کی عزت، عظمت، تکریم اور ہیبت بڑھا دے، اور اس کی تعظیم کرنے والوں کو، جو حج یا عمرہ ادا کریں، عزت، تکریم، عظمت اور نیکی میں بڑھا دے۔',
   source:'Shafi — attributed, widely reported'},
  {id:115,cats:['hajj'],icon:'🕋',ayat:false,
   title:'Dua during Tawaf',
   occ:'While circling the Kaʿbah — between Rukn Yamani and Hajar al-Aswad',
   arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',
   trans:'Rabbanā ātinā fid-dunyā ḥasanatan wa fil-ākhirati ḥasanatan wa qinā ʿadhābannār',
   english:'Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.',
   urdu:'اے ہمارے رب! ہمیں دنیا میں بھی بھلائی دے اور آخرت میں بھی بھلائی دے، اور ہمیں آگ کے عذاب سے بچا۔',
   source:'Quran 2:201 / Abu Dawud 1892 — read between Rukn Yamani and Hajar al-Aswad'},
  {id:116,cats:['hajj'],icon:'🕋',ayat:false,
   title:'When touching Hajar al-Aswad',
   occ:'When touching or gesturing towards the Black Stone',
   arabic:'بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ',
   trans:'Bismillāhi wallāhu akbar',
   english:'In the name of Allah, and Allah is the Greatest.',
   urdu:'اللہ کے نام سے، اور اللہ سب سے بڑا ہے۔',
   source:'Bukhari 1613'},
  {id:117,cats:['hajj'],icon:'🕋',ayat:false,
   title:'Dua on Mount Safā',
   occ:'When reaching Safa — face the Kaʿbah, raise hands',
   arabic:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ أَنْجَزَ وَعْدَهُ وَنَصَرَ عَبْدَهُ وَهَزَمَ الْأَحْزَابَ وَحْدَهُ',
   trans:'Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu wa huwa ʿalā kulli shayʾin qadīr. Lā ilāha illallāhu waḥdah, anjaza waʿdah, wa naṣara ʿabdah, wa hazamal-aḥzāba waḥdah',
   english:'None has the right to be worshipped except Allah alone, with no partner. To Him belongs sovereignty and praise, and He is over all things capable. None has the right to be worshipped but Allah alone — He fulfilled His promise, gave victory to His servant, and defeated the confederates alone.',
   urdu:'اللہ کے سوا کوئی معبود نہیں — اکیلا، بے شریک، اسی کی بادشاہی، اسی کی تعریف، وہ ہر چیز پر قادر ہے۔ اللہ کے سوا کوئی معبود نہیں — اکیلا — اس نے اپنا وعدہ پورا کیا، اپنے بندے کی مدد کی، اور تنہا لشکروں کو شکست دی۔',
   source:'Muslim 1218 — said 3 times on Safa'},
  {id:118,cats:['hajj'],icon:'🕋',ayat:false,
   title:'Dua on the Day of ʿArafah',
   occ:'The best dua — standing at ʿArafah on 9 Dhul Hijjah',
   arabic:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
   trans:'Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu wa huwa ʿalā kulli shayʾin qadīr',
   english:'None has the right to be worshipped except Allah alone, with no partner. To Him belongs sovereignty and all praise, and He is over all things capable.',
   urdu:'اللہ کے سوا کوئی معبود نہیں — اکیلا، بے شریک — اسی کی بادشاہی، اسی کی تعریف اور وہ ہر چیز پر قادر ہے۔',
   source:'Tirmidhi 3585 — "The best dua is dua on the Day of Arafah"'},
  // ══ DISTRESS ══════════════════════════════════════════════════════════
  {id:119,cats:['distress'],icon:'🤲',ayat:false,
   title:'Dua of distress — Lā ilāha illallāh al-ʿAẓīm',
   occ:'When severely distressed or anxious',
   arabic:'لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ',
   trans:'Lā ilāha illallāhul-ʿaẓīmul-ḥalīm, lā ilāha illallāhu Rabbul-ʿarshil-ʿaẓīm, lā ilāha illallāhu Rabbus-samāwāti wa Rabbul-arḍi wa Rabbul-ʿarshil-karīm',
   english:'There is no deity except Allah, the Almighty, the Forbearing. There is no deity except Allah, Lord of the Mighty Throne. There is no deity except Allah, Lord of the heavens, Lord of the earth, and Lord of the Noble Throne.',
   urdu:'اللہ کے سوا کوئی معبود نہیں — بزرگ، بردبار۔ اللہ کے سوا کوئی معبود نہیں — عرش عظیم کا رب۔ اللہ کے سوا کوئی معبود نہیں — آسمانوں کا رب، زمین کا رب اور عرش کریم کا رب۔',
   source:'Bukhari 6346, Muslim 2730'},
  {id:120,cats:['distress'],icon:'🤲',ayat:false,
   title:'Dua of grief and anxiety — Allahumma inni ʿabduk',
   occ:'When overwhelmed by grief, sadness, or anxiety',
   arabic:'اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ نَاصِيَتِي بِيَدِكَ مَاضٍ فِيَّ حُكْمُكَ عَدْلٌ فِيَّ قَضَاؤُكَ أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ سَمَّيْتَ بِهِ نَفْسَكَ أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي وَنُورَ صَدْرِي وَجَلَاءَ حُزْنِي وَذَهَابَ هَمِّي',
   trans:'Allāhumma innī ʿabduka ibnu ʿabdika ibnu amatika, nāṣiyatī biyadik, māḍin fiyya ḥukmuk, ʿadlun fiyya qaḍāʾuk, asʾaluka bi-kulli smin huwa laka sammayta bihi nafsaka aw anzaltahū fī kitābika aw ʿallamtahū aḥadan min khalqika aw istaʾtharta bihi fī ʿilmil-ghaybi ʿindak, an tajʿalal-qurʾāna rabīʿa qalbī wa nūra ṣadrī wa jalāʾa ḥuznī wa dhahāba hammī',
   english:'O Allah, I am Your slave, son of Your slave, son of Your female slave. My forelock is in Your hand, Your command over me is forever executed, and Your decree over me is just. I ask You by every name belonging to You by which You named Yourself, or revealed in Your Book, or taught any of Your creation, or kept to Yourself in the knowledge of the unseen — make the Quran the spring of my heart and the light of my chest, the removal of my sadness and the departure of my anxiety.',
   urdu:'اے اللہ! میں تیرا بندہ، تیرے بندے کا بیٹا، تیری بندی کا بیٹا ہوں۔ میری پیشانی تیرے ہاتھ میں ہے، تیرا حکم مجھ پر جاری ہے، تیرا فیصلہ مجھ میں عدل ہے۔ میں تجھ سے تیرے ہر نام سے مانگتا ہوں جو تو نے اپنے لیے رکھا، کتاب میں نازل کیا، مخلوق کو سکھایا یا علم غیب میں اپنے پاس رکھا — قرآن کو میرے دل کی بہار، سینے کی روشنی، غم کا علاج اور پریشانی کا جانا بنا دے۔',
   source:'Ahmad 3712 — "Allah will take away his grief and replace it with joy."'},
  {id:121,cats:['distress'],icon:'🤲',ayat:false,
   title:'Kafayatullah — Allah suffices',
   occ:'In hardship, when feeling helpless',
   arabic:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ',
   trans:'Ḥasbunallāhu wa niʿmal-wakīl',
   english:'Sufficient for us is Allah, and He is the best Disposer of affairs.',
   urdu:'ہمارے لیے اللہ کافی ہے اور وہ بہترین کارساز ہے۔',
   source:'Quran 3:173 / Bukhari 4563 — said by Ibrahim ﷺ when cast into fire'},
  {id:122,cats:['distress'],icon:'🤲',ayat:false,
   title:'Dua when facing difficulty',
   occ:'When a difficult matter befalls you',
   arabic:'اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا',
   trans:'Allāhumma lā sahla illā mā jaʿaltahū sahlā, wa anta tajʿalul-ḥazna idhā shiʾta sahlā',
   english:'O Allah, there is no ease except what You make easy, and You can make the difficult easy when You will.',
   urdu:'اے اللہ! کوئی آسانی نہیں مگر جسے تو آسان کرے، اور تو مشکل کو جب چاہے آسان بنا سکتا ہے۔',
   source:'Ibn Hibban 3/255, Ibn Abi Shaybah'},
  {id:123,cats:['distress'],icon:'🤲',ayat:true,
   title:'Dua of Ayyub ﷺ — dua in illness and hardship',
   occ:'In times of prolonged illness, hardship, or affliction',
   arabic:'رَبِّ إِنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ',
   trans:'Rabbi innī massaniyaḍ-ḍurru wa anta arḥamur-rāḥimīn',
   english:'My Lord, affliction has touched me and You are the Most Merciful of the merciful.',
   urdu:'اے میرے رب! مجھے تکلیف پہنچی ہے اور تو سب رحم کرنے والوں میں سب سے زیادہ رحم کرنے والا ہے۔',
   source:'Quran 21:83 — Allah responded and lifted his affliction'},
  {id:124,cats:['distress'],icon:'🤲',ayat:false,
   title:'Inna lillāhi — returning to Allah',
   occ:'Upon any calamity, loss, or bad news',
   arabic:'إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا',
   trans:'Innā lillāhi wa innā ilayhi rājiʿūn. Allāhumma ʾjurnī fī muṣībatī wa akhlif lī khayran minhā',
   english:'Indeed we belong to Allah and to Him we shall return. O Allah, reward me for my calamity and replace it with something better.',
   urdu:'بے شک ہم اللہ کے ہیں اور اسی کی طرف لوٹنے والے ہیں۔ اے اللہ! میری مصیبت میں مجھے اجر دے اور اس سے بہتر عطا فرما۔',
   source:'Muslim 918 — Umm Salamah: "No Muslim suffers calamity and says this but Allah gives him better in return."'},
  // ══ GRATITUDE ══════════════════════════════════════════════════════════
  {id:125,cats:['gratitude'],icon:'🌟',ayat:false,
   title:'Alhamdulillah — All praise to Allah',
   occ:'At all times — the best dhikr of gratitude',
   arabic:'الْحَمْدُ لِلَّهِ',
   trans:'Alḥamdu lillāh',
   english:'All praise is for Allah.',
   urdu:'تمام تعریف اللہ کے لیے ہے۔',
   source:'Muslim 2737 — "Alhamdulillah fills the scales."'},
  {id:126,cats:['gratitude'],icon:'🌟',ayat:false,
   title:'Shukr upon receiving a blessing',
   occ:'When something good happens or a blessing is received',
   arabic:'الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ',
   trans:'Alḥamdu lillāhil-ladhī biniʿmatihī tatimmuṣ-ṣāliḥāt',
   english:'Praise be to Allah, by Whose blessing all good things are completed.',
   urdu:'تعریف اللہ کے لیے جس کی نعمت سے تمام نیک کام مکمل ہوتے ہیں۔',
   source:'Ibn Majah 3803'},
  {id:127,cats:['gratitude'],icon:'🌟',ayat:false,
   title:'Shukr upon hardship ending',
   occ:'When a hardship is lifted or a difficulty resolved',
   arabic:'الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاكَ بِهِ وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا',
   trans:'Alḥamdu lillāhil-ladhī ʿāfānī mimmab-talāka bihī wa faḍḍalanī ʿalā kathīrin mimman khalaqa tafḍīlā',
   english:'Praise be to Allah who saved me from what He tested you with, and preferred me over many of His creation.',
   urdu:'تعریف اللہ کے لیے جس نے مجھے اس آزمائش سے بچایا جس میں تجھے مبتلا کیا اور مجھے اپنی بہت سی مخلوق پر فضیلت دی۔',
   source:'Tirmidhi 3431 — said upon seeing someone afflicted'},
  {id:128,cats:['gratitude'],icon:'🌟',ayat:true,
   title:'Dua of Sulayman ﷺ — gratitude for blessings',
   occ:'Upon receiving great blessings or success',
   arabic:'رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ',
   trans:'Rabbi awziʿnī an ashkura niʿmatakallati anʿamta ʿalayya wa ʿalā wālidayya wa an aʿmala ṣāliḥan tarḍāhu wa adkhilnī biraḥmatika fī ʿibādikaṣ-ṣāliḥīn',
   english:'My Lord, enable me to be grateful for Your favour which You have bestowed upon me and upon my parents, and to do righteousness of which You approve. And admit me by Your mercy into Your righteous servants.',
   urdu:'اے میرے رب! مجھے توفیق دے کہ میں تیری اس نعمت کا شکر ادا کروں جو تو نے مجھ پر اور میرے والدین پر فرمائی، اور یہ کہ میں ایسا نیک عمل کروں جو تجھے پسند ہو، اور مجھے اپنی رحمت سے اپنے نیک بندوں میں داخل فرما۔',
   source:'Quran 27:19'},
  {id:129,cats:['gratitude'],icon:'🌟',ayat:false,
   title:'SubhanAllah wa bihamdihi — glorification',
   occ:'100 times daily — all sins forgiven even like sea foam',
   arabic:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',
   trans:'Subḥānallāhi wa biḥamdih',
   english:'Glory be to Allah and praise be to Him.',
   urdu:'اللہ پاک ہے اور اس کے لیے تعریف ہے۔',
   source:'Bukhari 6405, Muslim 2691 — "Whoever says it 100×, his sins will be forgiven even if like sea foam."'},
  {id:130,cats:['gratitude'],icon:'🌟',ayat:false,
   title:'Best words of dhikr — four phrases',
   occ:'The four best words of remembrance',
   arabic:'سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ',
   trans:'Subḥānallāhi wal-ḥamdu lillāhi wa lā ilāha illallāhu wallāhu akbar',
   english:'Glory be to Allah, praise be to Allah, there is no deity but Allah, and Allah is the Greatest.',
   urdu:'اللہ پاک ہے، تعریف اللہ کے لیے، اللہ کے سوا کوئی معبود نہیں، اللہ سب سے بڑا ہے۔',
   source:'Muslim 2137 — "The most beloved words to Allah."'},

  {id:131,cats:['knowledge'],icon:'📚',ayat:true,
   title:'Rabbi zidni ʿilmā — increase in knowledge',
   occ:'Before studying, learning, or seeking knowledge',
   arabic:'رَبِّ زِدْنِي عِلْمًا',
   trans:'Rabbi zidnī ʿilmā',
   english:'My Lord, increase me in knowledge.',
   urdu:'اے میرے رب! مجھے علم میں اضافہ فرما۔',
   source:'Quran 20:114'},
  {id:132,cats:['knowledge'],icon:'📚',ayat:false,
   title:'Dua before studying',
   occ:'Before reading or studying',
   arabic:'اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي وَعَلِّمْنِي مَا يَنْفَعُنِي وَزِدْنِي عِلْمًا',
   trans:'Allāhumma nfaʿnī bimā ʿallamtanī wa ʿallimnī mā yanfaʿunī wa zidnī ʿilmā',
   english:'O Allah, benefit me with what You have taught me, teach me what will benefit me, and increase me in knowledge.',
   urdu:'اے اللہ! جو تو نے مجھے سکھایا اس سے مجھے فائدہ پہنچا، مجھے وہ سکھا جو میرے لیے نفع بخش ہو، اور مجھے علم میں اضافہ دے۔',
   source:'Tirmidhi 3599, Ibn Majah 251'},
  {id:133,cats:['knowledge'],icon:'📚',ayat:false,
   title:'Dua against useless knowledge',
   occ:'Seeking refuge from knowledge that does not benefit',
   arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ وَمِنْ قَلْبٍ لَا يَخْشَعُ وَمِنْ نَفْسٍ لَا تَشْبَعُ وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا',
   trans:'Allāhumma innī aʿūdhu bika min ʿilmin lā yanfaʿu wa min qalbin lā yakhshaʿu wa min nafsin lā tashbaʿu wa min daʿwatin lā yustajabu lahā',
   english:'O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that is not humble, from a soul that is not satisfied, and from a dua that is not answered.',
   urdu:'اے اللہ! میں تجھ سے پناہ مانگتا ہوں بے فائدہ علم سے، خشوع سے خالی دل سے، ناسیر نفس سے اور ایسی دعا سے جو قبول نہ ہو۔',
   source:'Muslim 2722, Nasai 5536'},
  {id:134,cats:['knowledge'],icon:'📚',ayat:false,
   title:'Dua for wisdom and understanding',
   occ:'When seeking deep understanding of the Quran or deen',
   arabic:'اللَّهُمَّ فَقِّهْنِي فِي الدِّينِ',
   trans:'Allāhumma faqqihnī fid-dīn',
   english:'O Allah, grant me understanding in the religion.',
   urdu:'اے اللہ! مجھے دین کی سمجھ عطا فرما۔',
   source:'Bukhari 143 — the Prophet ﷺ made this dua for Ibn Abbas'},
  {id:135,cats:['knowledge'],icon:'📚',ayat:false,
   title:'Dua after learning something',
   occ:'After completing a lesson or gaining knowledge',
   arabic:'اللَّهُمَّ اجْعَلْنِي مِمَّنْ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ',
   trans:'Allāhummaj-ʿalnī mimman yastamiʿūnal-qawla fayattabiʿūna aḥsanah',
   english:'O Allah, make me among those who listen to speech and follow the best of it.',
   urdu:'اے اللہ! مجھے ان لوگوں میں شامل فرما جو بات سنتے ہیں اور اس میں سے بہترین کی پیروی کرتے ہیں۔',
   source:'Based on Quran 39:18 — widely used as a dua'},
  // ══ RIZQ ════════════════════════════════════════════════════════════════
  {id:136,cats:['rizq'],icon:'💰',ayat:true,
   title:'Rabbanā ātinā — provision in both worlds',
   occ:'The most comprehensive dua for both worlds',
   arabic:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',
   trans:'Rabbanā ātinā fid-dunyā ḥasanatan wa fil-ākhirati ḥasanatan wa qinā ʿadhābannār',
   english:'Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.',
   urdu:'اے ہمارے رب! ہمیں دنیا میں بھی بھلائی دے اور آخرت میں بھی بھلائی دے، اور ہمیں آگ کے عذاب سے بچا۔',
   source:'Quran 2:201 / Bukhari 4522'},
  {id:137,cats:['rizq'],icon:'💰',ayat:false,
   title:'Dua for lawful provision',
   occ:'Asking for halal and sufficient rizq',
   arabic:'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ',
   trans:'Allāhummak-finī biḥalālika ʿan ḥarāmik wa aghnini bifaḍlika ʿamman siwāk',
   english:'O Allah, suffice me with what You have made lawful so that I need not resort to what You have forbidden, and enrich me with Your grace so I need no one other than You.',
   urdu:'اے اللہ! حلال سے مجھے کافی کر دے کہ حرام کی ضرورت نہ پڑے، اور اپنے فضل سے غنی فرما دے کہ تیرے سوا کسی کا محتاج نہ رہوں۔',
   source:'Tirmidhi 3563'},
  {id:138,cats:['rizq'],icon:'💰',ayat:false,
   title:'Dua for removal of debt',
   occ:'When burdened with debt',
   arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ',
   trans:'Allāhumma innī aʿūdhu bika minal-hammi wal-ḥazan, wa aʿūdhu bika minal-ʿajzi wal-kasal, wa aʿūdhu bika minal-jubni wal-bukhl, wa aʿūdhu bika min ghalabatid-dayni wa qahrir-rijāl',
   english:'O Allah, I seek refuge in You from worry and grief, from incapacity and laziness, from cowardice and miserliness, and from the burden of debt and the oppression of men.',
   urdu:'اے اللہ! غم و حزن سے، عاجزی و کاہلی سے، بزدلی و بخل سے، قرض کے بوجھ اور لوگوں کے تسلط سے تیری پناہ مانگتا ہوں۔',
   source:'Bukhari 2893'},
  {id:139,cats:['rizq'],icon:'💰',ayat:false,
   title:'Dua for barakah in wealth',
   occ:'Seeking blessings in one\'s wealth and livelihood',
   arabic:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',
   trans:'Allāhumma bārik lanā fīmā razaqtanā wa qinā ʿadhābannār',
   english:'O Allah, bless us in what You have provided for us and protect us from the punishment of the Fire.',
   urdu:'اے اللہ! جو رزق تو نے عطا کیا اس میں برکت دے اور ہمیں آگ کے عذاب سے بچا۔',
   source:'Al-Adab Al-Mufrad 1228'},
  {id:140,cats:['rizq'],icon:'💰',ayat:false,
   title:'Tawakkul — complete reliance on Allah',
   occ:'Morning and evening — entrusting one\'s provision to Allah',
   arabic:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ',
   trans:'Yā Ḥayyu yā Qayyūmu biraḥmatika astaghīth, aṣliḥ lī shaʾnī kullahū wa lā takilnī ilā nafsī ṭarfata ʿayn',
   english:'O Ever-Living, O Sustainer, in Your mercy I seek help. Rectify all my affairs and do not leave me to myself for the blink of an eye.',
   urdu:'اے ہمیشہ زندہ، اے قائم رکھنے والے — تیری رحمت سے فریاد کرتا ہوں۔ میرے سارے معاملات درست فرما دے اور ایک پل کے لیے بھی مجھے میرے نفس کے حوالے نہ کرنا۔',
   source:'Hakim 1/545, authenticated by Al-Albani'},
  // ══ DEATH & AFTERLIFE ══════════════════════════════════════════════════
  {id:141,cats:['death'],icon:'🌹',ayat:false,
   title:'Dua upon hearing of someone\'s death',
   occ:'When you hear that someone has died',
   arabic:'إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ',
   trans:'Innā lillāhi wa innā ilayhi rājiʿūn',
   english:'Indeed we belong to Allah, and indeed to Him we will return.',
   urdu:'بے شک ہم اللہ کے ہیں اور اسی کی طرف لوٹنے والے ہیں۔',
   source:'Quran 2:156'},
  {id:142,cats:['death'],icon:'🌹',ayat:false,
   title:'Closing the eyes of the deceased',
   occ:'When closing the eyes of a person who has just died',
   arabic:'اللَّهُمَّ اغْفِرْ لِفُلَانٍ وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّينَ وَاخْلُفْهُ فِي عَقِبِهِ فِي الْغَابِرِينَ وَاغْفِرْ لَنَا وَلَهُ يَا رَبَّ الْعَالَمِينَ وَأَفْسِحْ لَهُ فِي قَبْرِهِ وَنَوِّرْ لَهُ فِيهِ',
   trans:'Allāhummaghfir li-fulānin warfaʿ darajatahū fil-mahdiyyīn, wakhlufhu fī ʿaqibihī fil-ghābirīn, waghfir lanā wa lah yā Rabbal-ʿālamīn, wa afsiḥ lahu fī qabrihī wa nawwir lahu fīh',
   english:'O Allah, forgive [name] and elevate his rank among the guided ones, and grant him successors among his descendants; forgive us and him, O Lord of the worlds; expand his grave and illuminate it for him.',
   urdu:'اے اللہ! [نام] کو بخش دے، اہل ہدایت میں اس کا درجہ بلند فرما، اس کے بعد آنے والوں میں اس کا جانشین بنا، ہمیں اور اسے بخش دے اے رب العالمین، اس کی قبر کشادہ کر اور اس میں روشنی کر دے۔',
   source:'Muslim 920'},
  {id:143,cats:['death'],icon:'🌹',ayat:false,
   title:'Janazah prayer — first takbir',
   occ:'After first takbir in salat al-janazah',
   arabic:'اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مَدْخَلَهُ وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ',
   trans:'Allāhummaghfir lahū warḥamhu wa ʿāfihī waʿfu ʿanh, wa akrim nuzulahu wa wassiʿ madkhalahu, waghsilhu bil-māʾi wath-thalji wal-barad',
   english:'O Allah, forgive him, have mercy on him, pardon him, grant him honour, make his place of entry spacious, wash him with water, snow and hail.',
   urdu:'اے اللہ! اسے معاف کر، اس پر رحم فرما، اسے عافیت دے، اس سے درگزر فرما، اس کی مہمانی عزت سے فرما، اس کی جگہ کشادہ کر، اسے پانی، برف اور اولوں سے دھو۔',
   source:'Muslim 963'},
  {id:144,cats:['death'],icon:'🌹',ayat:false,
   title:'Janazah prayer — continued',
   occ:'Continuing the janazah dua after washing dua',
   arabic:'وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ وَأَدْخِلْهُ الْجَنَّةَ وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ',
   trans:'Wa naqqihī minal-khaṭāyā kamā naqqaytath-thawbal-abyaḍa minad-danas, wa abdilhu dāran khayran min dārih wa ahlan khayran min ahlih wa zawjan khayran min zawjih, wa adkhilhul-jannah wa aʿidhhū min ʿadhābil-qabri wa min ʿadhābinnār',
   english:'Cleanse him of sins as white cloth is cleansed of filth. Replace his home with a better home, his family with a better family, his spouse with a better spouse; admit him to Jannah and protect him from the punishment of the grave and the punishment of the Fire.',
   urdu:'اسے گناہوں سے ایسے صاف کر جیسے سفید کپڑے کو میل سے صاف کیا جاتا ہے۔ اسے اس کے گھر سے بہتر گھر، اس کے اہل سے بہتر اہل اور اس کی بیوی سے بہتر بیوی دے۔ اسے جنت میں داخل کر اور قبر کے عذاب اور آگ کے عذاب سے بچا۔',
   source:'Muslim 963'},
  {id:145,cats:['death'],icon:'🌹',ayat:false,
   title:'Dua when visiting graves',
   occ:'When entering the cemetery',
   arabic:'السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ',
   trans:'As-salāmu ʿalaykum ahlad-diyāri minal-muʾminīna wal-muslimīn, wa innā in shāʾallāhu bikum lāḥiqūn, nasʾalullāha lanā wa lakumul-ʿāfiyah',
   english:'Peace be upon you, O inhabitants of this place from among the believers and Muslims. Indeed we will, if Allah wills, join you. We ask Allah for well-being for us and for you.',
   urdu:'اے اس جگہ کے مومن اور مسلمان مکینوں پر سلامتی ہو۔ ہم بھی ان شاء اللہ تم سے ملنے والے ہیں۔ ہم اللہ سے اپنے لیے اور تمہارے لیے عافیت مانگتے ہیں۔',
   source:'Muslim 975'},
  {id:146,cats:['death'],icon:'🌹',ayat:false,
   title:'Dua for protection from grave punishment',
   occ:'After tashahhud in every salah — before salaam',
   arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ',
   trans:'Allāhumma innī aʿūdhu bika min ʿadhābil-qabri wa min ʿadhābinnāri wa min fitnatil-maḥyā wal-mamāti wa min sharri fitnatil-masīḥid-dajjāl',
   english:'O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hellfire, from the trials of life and death, and from the evil of the trial of the False Messiah.',
   urdu:'اے اللہ! میں قبر کے عذاب سے، آگ کے عذاب سے، زندگی و موت کی آزمائش سے اور مسیح دجال کی آزمائش کی برائی سے تیری پناہ مانگتا ہوں۔',
   source:'Bukhari 1377, Muslim 588 — obligatory to learn and say before every salam in salah'},
  // ══ QURANIC DUAS ════════════════════════════════════════════════════════
  {id:147,cats:['quran'],icon:'📖',ayat:true,
   title:'Al-Fātiḥah — The Opening',
   occ:'Every rakah of every prayer — and as a general dua',
   arabic:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الرَّحْمَٰنِ الرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',
   trans:'Alḥamdu lillāhi Rabbil-ʿālamīn, Ar-Raḥmānir-Raḥīm, Māliki yawmid-dīn, iyyāka naʿbudu wa iyyāka nastaʿīn, ihdinaṣ-ṣirāṭal-mustaqīm, ṣirāṭal-ladhīna anʿamta ʿalayhim, ghayril-maghḍūbi ʿalayhim wa laḍ-ḍāllīn',
   english:'Praise be to Allah, Lord of all worlds, the Most Gracious, the Most Merciful, Master of the Day of Judgement. You alone we worship and You alone we ask for help. Guide us to the straight path — the path of those You have blessed, not of those who have earned anger, nor of those who have gone astray.',
   urdu:'تمام تعریف اللہ کے لیے جو تمام جہانوں کا رب ہے، بے حد مہربان، نہایت رحم والا، روز جزا کا مالک۔ ہم تیری ہی عبادت کرتے ہیں اور تجھی سے مدد مانگتے ہیں۔ ہمیں سیدھی راہ دکھا — ان لوگوں کی راہ جن پر تو نے انعام کیا، نہ کہ غضب کیے گئوں کی، نہ گمراہوں کی۔',
   source:'Quran 1:1-7 — "There is no prayer for one who does not recite it." — Bukhari 756'},
  {id:148,cats:['quran'],icon:'📖',ayat:true,
   title:'Āl ʿImrān — dua of the people of understanding',
   occ:'After remembering Allah — especially in the night',
   arabic:'رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ رَبَّنَا إِنَّكَ مَنْ تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنْصَارٍ',
   trans:'Rabbanā mā khalaqta hādhā bāṭilā, subḥānaka faqinā ʿadhābannār. Rabbanā innaka man tudkhilinnāra faqad akhzaytah, wa mā liẓ-ẓālimīna min anṣār',
   english:'Our Lord, You have not created this in vain; glory be to You, so protect us from the punishment of the Fire. Our Lord, whoever You admit to the Fire, You have disgraced; and for the wrongdoers there are no helpers.',
   urdu:'اے ہمارے رب! تو نے یہ بے فائدہ نہیں بنایا — تو پاک ہے — ہمیں آگ کے عذاب سے بچا۔ اے ہمارے رب! جسے تو آگ میں داخل کرے اسے رسوا کیا اور ظالموں کا کوئی مددگار نہیں۔',
   source:'Quran 3:191-192'},
  {id:149,cats:['quran'],icon:'📖',ayat:true,
   title:'Dua of Musa ﷺ — Rabb inni limā',
   occ:'When in need, in a difficult situation, seeking help',
   arabic:'رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ',
   trans:'Rabbi innī limā anzalta ilayya min khayrin faqīr',
   english:'My Lord, indeed I am in need of whatever good You send down to me.',
   urdu:'اے میرے رب! بے شک میں تیری طرف سے نازل ہونے والی ہر بھلائی کا محتاج ہوں۔',
   source:'Quran 28:24 — Musa ﷺ said this when he had nothing, and within a short time Allah provided for him'},
  {id:150,cats:['quran'],icon:'📖',ayat:true,
   title:'Dua of Ibrahim ﷺ — Rabb habli',
   occ:'Asking for a righteous child',
   arabic:'رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ',
   trans:'Rabbi hab lī minaṣ-ṣāliḥīn',
   english:'My Lord, grant me a child from among the righteous.',
   urdu:'اے میرے رب! مجھے نیک لوگوں میں سے (اولاد) عطا فرما۔',
   source:'Quran 37:100 — dua of Ibrahim ﷺ for Ismail ﷺ'},
  {id:151,cats:['quran'],icon:'📖',ayat:true,
   title:'Dua for good ending — Tawaffanī',
   occ:'Asking to die in a state of Islam and join the righteous',
   arabic:'رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِنْ تَأْوِيلِ الْأَحَادِيثِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ',
   trans:'Rabbi qad ātaytanī minal-mulki wa ʿallamtanī min taʾwīlil-aḥādīth, fāṭiras-samāwāti wal-arḍ, anta waliyyī fid-dunyā wal-ākhirah, tawaffanī musliman wa alḥiqnī biṣ-ṣāliḥīn',
   english:'My Lord, You have given me sovereignty and taught me the interpretation of dreams. Creator of the heavens and earth, You are my guardian in this world and the Hereafter. Cause me to die a Muslim and join me with the righteous.',
   urdu:'اے میرے رب! تو نے مجھے بادشاہت دی اور خوابوں کی تعبیر سکھائی۔ آسمانوں اور زمین کے پیدا کرنے والے — دنیا اور آخرت میں تو ہی میرا ولی ہے۔ مجھے مسلمان اٹھا اور نیکوں کے ساتھ ملا دے۔',
   source:'Quran 12:101 — dua of Yusuf ﷺ'},
  {id:152,cats:['quran','distress'],icon:'📖',ayat:true,
   title:'Surah al-Baqarah — last two verses',
   occ:'Before sleeping — every night; sufficient against all evil',
   arabic:'آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ',
   trans:'Āmanar-rasūlu bimā unzila ilayhi mir-Rabbihī wal-muʾminūn, kullun āmana billāhi wa malāʾikatihī wa kutubihī wa rusulih, lā nufarriqu bayna aḥadin mir-rusulih, wa qālū samiʿnā wa aṭaʿnā, ghufrānaka Rabbanā wa ilaykal-maṣīr',
   english:'The Messenger has believed in what was revealed to him from his Lord, and so have the believers. All of them have believed in Allah, His angels, His books and His messengers — making no distinction between any of His messengers. And they say: We hear and we obey. Your forgiveness, our Lord, and to You is the destination. (Continue with the next verse 2:286)',
   urdu:'رسول نے مانا جو اس پر اس کے رب کی طرف سے اترا اور مومنوں نے بھی — سب نے اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان لایا — ہم اس کے رسولوں میں سے کسی میں فرق نہیں کرتے — اور انہوں نے کہا: ہم نے سنا اور مانا — تیری بخشش اے ہمارے رب اور تیری ہی طرف لوٹنا ہے۔',
   source:'Quran 2:285-286 — "Whoever recites these two verses at night, they will suffice him." — Bukhari 5009'},
  // ══ MORNING EXTRA ══════════════════════════════════════════════════════
  {id:153,cats:['morning'],icon:'🌅',ayat:false,
   title:'Morning — seeking good of the day',
   occ:'Morning — dua for good in the day ahead',
   arabic:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',
   trans:'Allāhumma bika aṣbaḥnā wa bika amsaynā wa bika naḥyā wa bika namūtu wa ilaykan-nushūr',
   english:'O Allah, by You we have entered the morning, by You we have entered the evening, by You we live and by You we die, and to You is the resurrection.',
   urdu:'اے اللہ! تیری ہی مدد سے ہم نے صبح کی، تیری ہی مدد سے شام کی، تیری مدد سے ہم جیتے ہیں، تیری مدد سے مرتے ہیں اور تیری ہی طرف اٹھنا ہے۔',
   source:'Abu Dawud 5068, Tirmidhi 3391'},
  {id:154,cats:['morning'],icon:'🌅',ayat:false,
   title:'Morning — protection of the Prophet ﷺ',
   occ:'Morning — 3 times for complete protection',
   arabic:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ',
   trans:'Asbaḥnā wa asbaḥal-mulku lillāhi Rabbil-ʿālamīn. Allāhumma innī asʾaluka khayra hādhal-yawmi fatḥahū wa naṣrahū wa nūrahū wa barakatahū wa hudāh, wa aʿūdhu bika min sharri mā fīhi wa sharri mā baʿdah',
   english:'We have entered the morning and sovereignty belongs to Allah, Lord of all worlds. O Allah, I ask You for the good of this day — its victory, its light, its blessing and its guidance; and I seek refuge in You from its evil and the evil of what comes after it.',
   urdu:'ہم نے صبح کی اور بادشاہی اللہ رب العالمین کے لیے ہے۔ اے اللہ! اس دن کی بھلائی مانگتا ہوں — اس کی فتح، نصرت، نور، برکت اور ہدایت — اور اس دن کی برائی اور اس کے بعد کی برائی سے پناہ مانگتا ہوں۔',
   source:'Abu Dawud 5084'},
  // ══ EVENING EXTRA ══════════════════════════════════════════════════════
  {id:155,cats:['evening'],icon:'🌙',ayat:false,
   title:'Evening — entering the night',
   occ:'Evening — at the approach of night',
   arabic:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ فَتْحَهَا وَنَصْرَهَا وَنُورَهَا وَبَرَكَتَهَا وَهُدَاهَا وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا',
   trans:'Amsaynā wa amsal-mulku lillāhi Rabbil-ʿālamīn. Allāhumma innī asʾaluka khayra hādhihil-laylati fatḥahā wa naṣrahā wa nūrahā wa barakatahā wa hudāhā, wa aʿūdhu bika min sharri mā fīhā wa sharri mā baʿdahā',
   english:'We have entered the evening and sovereignty belongs to Allah, Lord of all worlds. O Allah, I ask You for the good of this night — its victory, its light, its blessing and its guidance; and I seek refuge in You from its evil and the evil of what comes after it.',
   urdu:'ہم نے شام کی اور بادشاہی اللہ رب العالمین کے لیے ہے۔ اے اللہ! اس رات کی بھلائی مانگتا ہوں — اس کی فتح، نصرت، نور، برکت اور ہدایت — اور اس رات کی برائی اور اس کے بعد کی برائی سے پناہ مانگتا ہوں۔',
   source:'Abu Dawud 5084'},
  {id:156,cats:['evening'],icon:'🌙',ayat:false,
   title:'Evening — committing affairs to Allah',
   occ:'Evening — entrusting oneself to Allah at night',
   arabic:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
   trans:'Amsaynā wa amsal-mulku lillāh, wal-ḥamdu lillāh, lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu wa huwa ʿalā kulli shayʾin qadīr',
   english:'We have entered the evening and sovereignty belongs to Allah. All praise is for Allah. There is no deity but Allah alone, without partner. To Him belongs sovereignty and praise, and He is over all things capable.',
   urdu:'ہم نے شام کی اور بادشاہی اللہ کے لیے ہے۔ سب تعریف اللہ کے لیے۔ اللہ کے سوا کوئی معبود نہیں — اکیلا، بے شریک — اسی کی بادشاہی، اسی کی تعریف، وہ ہر چیز پر قادر ہے۔',
   source:'Muslim 2723'},
  // ══ PRAYER EXTRAS ══════════════════════════════════════════════════════
  {id:157,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Dua for good prayer',
   occ:'Before beginning salah',
   arabic:'وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ',
   trans:'Wajjahtu wajhiya lilladhī faṭaras-samāwāti wal-arḍa ḥanīfan wa mā ana minal-mushrikīn',
   english:'I have turned my face toward the One Who created the heavens and earth — a true monotheist — and I am not of the polytheists.',
   urdu:'میں نے اپنا رخ اس ذات کی طرف کر لیا جس نے آسمانوں اور زمین کو بنایا — یک سو ہو کر — اور میں مشرکوں میں سے نہیں ہوں۔',
   source:'Muslim 771 — the opening dua (iftitah) of the Prophet ﷺ'},
  {id:158,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Iftitah — Subhanakallahumma',
   occ:'At the beginning of salah, after takbir',
   arabic:'سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالَى جَدُّكَ وَلَا إِلَهَ غَيْرُكَ',
   trans:'Subḥānakallāhumma wa biḥamdika wa tabārakasmuك wa taʿālā jadduka wa lā ilāha ghayruk',
   english:'Glory and praise be to You, O Allah. Blessed is Your name and exalted is Your majesty; and there is no deity other than You.',
   urdu:'اے اللہ! تو پاک ہے اور تیری تعریف ہے، تیرا نام بابرکت ہے، تیری عظمت بلند ہے اور تیرے سوا کوئی معبود نہیں۔',
   source:'Abu Dawud 775, Tirmidhi 243'},
  {id:159,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Dua between two sujood',
   occ:'When sitting between the two prostrations',
   arabic:'رَبِّ اغْفِرْ لِي رَبِّ اغْفِرْ لِي',
   trans:'Rabbighfir lī, rabbighfir lī',
   english:'My Lord, forgive me. My Lord, forgive me.',
   urdu:'اے میرے رب! مجھے بخش دے، اے میرے رب! مجھے بخش دے۔',
   source:'Ibn Majah 897'},
  {id:160,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Full dua between two sujood',
   occ:'Sitting between the two prostrations — full version',
   arabic:'اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَاجْبُرْنِي وَعَافِنِي وَارْزُقْنِي وَارْفَعْنِي',
   trans:'Allāhummaghfir lī warḥamnī wahdinī wajburnī wa ʿāfinī warzuqnī warfaʿnī',
   english:'O Allah, forgive me, have mercy on me, guide me, support me, give me well-being, provide for me, and raise me.',
   urdu:'اے اللہ! مجھے بخش، مجھ پر رحم کر، مجھے ہدایت دے، میری مشکل آسان کر، مجھے عافیت دے، مجھے رزق دے اور مجھے بلند کر۔',
   source:'Abu Dawud 850, Tirmidhi 284'},
  {id:161,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Sujood — additional dua in prostration',
   occ:'While in sujood — the closest position to Allah',
   arabic:'سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ',
   trans:'Subbūḥun quddūsun Rabbul-malāʾikati war-rūḥ',
   english:'Perfect and Holy — Lord of the angels and the Spirit.',
   urdu:'پاک، قدوس — فرشتوں اور روح کا رب۔',
   source:'Muslim 487 — the Prophet ﷺ said this frequently in ruku and sujood'},
  {id:162,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Tashahhud',
   occ:'In every prayer, sitting position (tashahud)',
   arabic:'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',
   trans:'At-taḥiyyātu lillāhi waṣ-ṣalawātu waṭ-ṭayyibāt, as-salāmu ʿalayka ayyuhan-nabiyyu wa raḥmatullāhi wa barakātuh, as-salāmu ʿalaynā wa ʿalā ʿibādillāhiṣ-ṣāliḥīn, ashhadu an lā ilāha illallāhu wa ashhadu anna Muḥammadan ʿabduhū wa rasūluh',
   english:'All greetings of humility and worship are for Allah, and all good things. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I testify that there is no deity except Allah, and I testify that Muhammad is His slave and messenger.',
   urdu:'تمام تعظیم، عبادت اور پاکیزگی اللہ کے لیے ہے۔ اے نبی! آپ پر سلام ہو، اللہ کی رحمت اور برکات ہوں۔ ہم پر اور اللہ کے نیک بندوں پر سلام ہو۔ میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں اور محمدﷺ اس کے بندے اور رسول ہیں۔',
   source:'Bukhari 831, Muslim 402'},
  {id:163,cats:['prayer'],icon:'🙏',ayat:false,
   title:'Ibrahimi salawat — Durood Ibrahim',
   occ:'After tashahhud — said in every prayer',
   arabic:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ',
   trans:'Allāhumma ṣalli ʿalā Muḥammadin wa ʿalā āli Muḥammadin, kamā ṣallayta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīm, innaka Ḥamīdun Majīd. Allāhumma bārik ʿalā Muḥammadin wa ʿalā āli Muḥammadin, kamā bārakta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīm, innaka Ḥamīdun Majīd',
   english:'O Allah, send prayers upon Muhammad and the family of Muhammad, as You sent prayers upon Ibrahim and the family of Ibrahim — You are praiseworthy, majestic. O Allah, send blessings upon Muhammad and the family of Muhammad, as You sent blessings upon Ibrahim and the family of Ibrahim — You are praiseworthy, majestic.',
   urdu:'اے اللہ! محمدﷺ پر اور ان کی آل پر رحمت نازل فرما جیسے تو نے ابراہیم ؑ اور ان کی آل پر نازل فرمائی — بے شک تو قابل تعریف، بزرگ ہے۔ اے اللہ! محمدﷺ پر اور ان کی آل پر برکت نازل فرما جیسے ابراہیم ؑ اور ان کی آل پر فرمائی — بے شک تو قابل تعریف، بزرگ ہے۔',
   source:'Bukhari 3370, Muslim 406'},

  {id:166,cats:['daily'],icon:'☀️',ayat:false,

   arabic:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ',

  {id:167,cats:['daily'],icon:'☀️',ayat:false,
   title:'Lā ḥawla wa lā quwwata — kanz al-jannah',
   occ:'At all times — treasure of Paradise',

  {id:169,cats:['daily','morning'],icon:'☀️',ayat:false,

   trans:'Lā ilāha illallāhu waḥdahū lā sharīka lah, lahul-mulku wa lahul-ḥamdu yuḥyī wa yumītu wa huwa ʿalā kulli shayʾin qadīr',

   urdu:'اللہ کے سوا کوئی معبود نہیں — اکیلا، بے شریک — اسی کی بادشاہی، اسی کی تعریف اور وہ ہر چیز پر قادر ہے۔',

  // ══ DISTRESS EXTRAS ═════════════════════════════════════════════════════

   english:'O Allah, I hope for Your mercy — do not leave me to myself even for the blink of an eye. Rectify all my affairs. There is no deity but You.',

   trans:'Allāhumma innī aʿūdhu bika minal-hammi wal-ḥazan',

  {id:174,cats:['distress'],icon:'🤲',ayat:false,

  {id:183,cats:['quran','protection'],icon:'📖',ayat:true,

  {id:184,cats:['quran','rizq'],icon:'📖',ayat:true,

   source:'Quran 11:88 — dua of Shuʿayb ﷺ'},
  {id:185,cats:['quran','morning'],icon:'📖',ayat:true,
   title:'Dua for light in every direction',
   occ:'In the last third of the night or when seeking spiritual light',

   trans:'Allāhummaj-ʿal fī qalbī nūran wa fī lisānī nūran wa fī samʿī nūran wa fī baṣarī nūran, wa min fawqī nūran wa min taḥtī nūran wa ʿan yamīnī nūran wa ʿan shimālī nūran wa min amāmī nūran wa min khalfī nūran wajʿal lī nūrā',
   english:'O Allah, place light in my heart, light on my tongue, light in my hearing, light in my sight, light above me, light below me, light to my right, light to my left, light in front of me, light behind me — and make light for me.',
   urdu:'اے اللہ! میرے دل میں نور، زبان میں نور، سماعت میں نور، بصارت میں نور، اوپر نور، نیچے نور، دائیں نور، بائیں نور، آگے نور، پیچھے نور رکھ دے — اور میرے لیے نور بنا دے۔',
   source:'Bukhari 6316, Muslim 763 — the Prophet ﷺ said this going to pray Tahajjud'},

// ── State ──────────────────────────────────────────────────────────────────
let selectedCat    = 'all';
let searchQuery    = '';
let currentTab     = 'duas';
let familyDuas     = JSON.parse(localStorage.getItem('duas-family') || '[]');

// ── Render Categories ──────────────────────────────────────────────────────
function renderCats() {
  document.getElementById('catPills').innerHTML = CATS.map(c =>
    `<button class="cat-pill${c.id === selectedCat ? ' active' : ''}" onclick="selectCat('${c.id}')">
       ${c.icon} ${c.label}
     </button>`
  ).join('');
}

function selectCat(id) {
  selectedCat = id;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  renderCats();
  renderDuas();
}

// ── Search ────────────────────────────────────────────────────────────────
function onSearch(val) {
  searchQuery = val.toLowerCase().trim();
  selectedCat = searchQuery ? 'all' : selectedCat;
  renderCats();
  renderDuas();
}

// ── Render Duas ───────────────────────────────────────────────────────────
function getVisible() {
  let list = DUAS;
  if (selectedCat !== 'all') list = list.filter(d => d.cats.includes(selectedCat));
  if (searchQuery) {
    list = list.filter(d =>
      d.title.toLowerCase().includes(searchQuery) ||
      d.english.toLowerCase().includes(searchQuery) ||
      d.trans.toLowerCase().includes(searchQuery) ||
      d.occ.toLowerCase().includes(searchQuery)
    );
  }
  return list;
}

function renderDuas() {
  const list = getVisible();
  const badge = document.getElementById('countBadge');
  badge.textContent = list.length;

  if (!list.length) {
    document.getElementById('duaList').innerHTML =
      `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-text">No duas found.</div></div>`;
    return;
  }

  document.getElementById('duaList').innerHTML = list.map(d => `
    <div class="dua-card${d.ayat ? ' ayat' : ''}" id="dc-${d.id}" onclick="toggleCard(${d.id})">
      <div class="card-head">
        <div class="card-icon">${d.icon}</div>
        <div class="card-meta">
          <div class="card-title">${d.title}</div>
          <div class="card-occ">${d.occ}</div>
        </div>
        <div class="card-expand">›</div>
      </div>
      <div class="arabic-preview">${d.arabic.split('\n')[0]}</div>
      <div class="card-body">
        <div class="divider"></div>
        <div class="arabic-full">${d.arabic.replace(/\n/g,'<br>')}</div>
        <div class="trans-block">
          <div class="trans-label">Transliteration</div>
          <div class="trans-text">${d.trans.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="english-block">
          <div class="meaning-label">English Meaning</div>
          <div class="english-text">${d.english.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="urdu-block">
          <div class="urdu-label">اردو ترجمہ</div>
          <div class="urdu-text">${d.urdu.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="card-footer">
          <div class="source-text">— ${d.source}</div>
          <button class="copy-btn" id="copy-${d.id}" onclick="copyDua(event, ${d.id})">Copy</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleCard(id) {
  const el = document.getElementById('dc-'+id);
  el.classList.toggle('open');
}

// ── Copy ──────────────────────────────────────────────────────────────────
function copyDua(e, id) {
  e.stopPropagation();
  const d = DUAS.find(x => x.id === id);
  if (!d) return;
  const text = `${d.title}\n\n${d.arabic}\n\nTransliteration:\n${d.trans}\n\nMeaning:\n${d.english}\n\nUrdu:\n${d.urdu}\n\n— ${d.source}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-'+id);
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {});
}

// ── Family Duas ───────────────────────────────────────────────────────────
function saveFamily() { localStorage.setItem('duas-family', JSON.stringify(familyDuas)); }

function addFamily() {
  const name = document.getElementById('fname').value.trim();
  const rel  = document.getElementById('frelation').value.trim();
  const dua  = document.getElementById('fduareq').value.trim();
  if (!name || !dua) return;
  familyDuas.unshift({ id:Date.now(), name, rel, dua, done:false });
  saveFamily();
  document.getElementById('fname').value = '';
  document.getElementById('frelation').value = '';
  document.getElementById('fduareq').value = '';
  renderFamily();
}

function toggleFamilyDone(id) {
  const f = familyDuas.find(x => x.id === id);
  if (f) { f.done = !f.done; saveFamily(); renderFamily(); }
}

function deleteFamily(id) {
  familyDuas = familyDuas.filter(x => x.id !== id);
  saveFamily(); renderFamily();
}

function renderFamily() {
  const grid = document.getElementById('familyGrid');
  if (!familyDuas.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-ico">🤲</div><div class="empty-text">Add family members above.<br>Their duas will be remembered.</div></div>`;
    return;
  }
  grid.innerHTML = `<div class="family-grid">${familyDuas.map(f => `
    <div class="fcard${f.done ? ' done-card' : ''}">
      <div class="fname-row">
        <span class="fname-text">${f.name}${f.rel ? ` <span class="frel">(${f.rel})</span>` : ''}</span>
        <button class="fcheck${f.done ? ' done' : ''}" onclick="toggleFamilyDone(${f.id})">${f.done ? '✓' : ''}</button>
      </div>
      <div class="fdua-text">${f.dua}</div>
      <button class="fdel" onclick="deleteFamily(${f.id})">✕ remove</button>
    </div>`).join('')}</div>`;
}

// ── Tab Switching ─────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  currentTab = tab;
}

// ── Init ──────────────────────────────────────────────────────────────────
renderCats();
renderDuas();
renderFamily();
</script>
