function autoDetectNeed(text) {
  const t = text.toLowerCase();
  let detected = '';
  if (/shifa|sick|ill|cancer|surgery|hospital|health|heal|marz/.test(t)) detected = 'shifa';
  else if (/marriage|spouse|rishta|husband|wife|nikah|shaadi/.test(t)) detected = 'marriage';
  else if (/child|baby|pregn|children|offspring|son|daughter/.test(t)) detected = 'children';
  else if (/exam|study|degree|pass|test|graduate|license|resid|carms|nac|qe/.test(t)) detected = 'knowledge';
  else if (/job|work|income|career|employ|salary|profession/.test(t)) detected = 'rizq';
  else if (/rizq|money|wealth|provision|debt|loan|financial/.test(t)) detected = 'rizq';
  else if (/forgiv|maghfir|sin|tawbah|repent/.test(t)) detected = 'forgiveness';
  else if (/deceased|died|jannah|passed away|death|wafat|rahmat/.test(t)) detected = 'deceased';
  else if (/anxiety|stress|depress|peace|calm|worry|grief|mental/.test(t)) detected = 'anxiety';
  else if (/hajj|umrah|mecca|kabah|pilgrimage/.test(t)) detected = 'hajj';
  else if (/protect|evil|harm|safe|nazar|sihr/.test(t)) detected = 'protection';
  else if (/guide|hidayah|iman|faith|quran|deen/.test(t)) detected = 'guidance';
  else if (t.length > 10) detected = 'general';

  const hint = document.getElementById('enhanceHint');
  const sel  = document.getElementById('fneed');
  if (detected && sel.value === '') {
    sel.value = detected;
    onNeedChange();
    hint.style.display = 'block';
    hint.textContent = '✨ Auto-detected: ' + sel.options[sel.selectedIndex].text;
  } else if (!detected) {
    hint.style.display = 'none';
  }
}

function saveFamily() { localStorage.setItem('hajj-family', JSON.stringify(familyDuas)); }
function renderFamily() { renderUnifiedList(); }

function onNeedChange() {
  const need = document.getElementById('fneed').value;
  const preview = document.getElementById('fduapreview');
  if (!need || !FAMILY_DUAS[need]) { preview.style.display = 'none'; return; }
  const d = FAMILY_DUAS[need];
  preview.style.display = 'block';
  preview.innerHTML = `
    <div class="fdua-preview-arabic">${d.arabic}</div>
    <div class="fdua-preview-trans">${d.trans}</div>
    <div class="fdua-preview-english">${d.english}</div>`;
}

function addFamily() {
  const name = document.getElementById('fname').value.trim();
  const rel  = document.getElementById('frelation').value.trim();
  const need = document.getElementById('fneed').value;
  if (!name || !need) { alert('Please enter a name and select a category.'); return; }
  const d = FAMILY_DUAS[need];
  const req = document.getElementById('fduareq').value.trim();
  const newId = Date.now();
  familyDuas.unshift({ id: newId, name, rel, need, req,
    label: d.label, arabic: d.arabic, trans: d.trans,
    english: d.english, urdu: d.urdu, source: d.source, done: false });
  saveFamily();
  // Put new card at the very top of the unified order
  const list = getUnifiedList();
  const ni = list.findIndex(e => e.type === 'family' && e.item.id === newId);
  if (ni > 0) { const [ent] = list.splice(ni, 1); list.unshift(ent); }
  unifiedOrder = list.map(({type, item}) => ({type, id: item.id}));
  saveUnifiedOrder();
  document.getElementById('fname').value = '';
  document.getElementById('frelation').value = '';
  document.getElementById('fneed').value = '';
  document.getElementById('fduareq').value = '';
  document.getElementById('enhanceHint').style.display = 'none';
  document.getElementById('fduapreview').style.display = 'none';
  renderUnifiedList();
  toggleAddForm();
}

function toggleFamilyDone(id) {
  const f = familyDuas.find(x => x.id === id);
  if (f) { f.done = !f.done; saveFamily(); renderUnifiedList(); }
}

function deleteFamily(id) {
  familyDuas = familyDuas.filter(x => x.id !== id);
  saveFamily();
  if (unifiedOrder) {
    unifiedOrder = unifiedOrder.filter(o => !(o.type === 'family' && String(o.id) === String(id)));
    saveUnifiedOrder();
  }
  renderUnifiedList();
}

function toggleFamilyCard(id) {
  document.getElementById('fc-' + id)?.classList.toggle('open');
}

function moveToTop(type, id) {
  const list = getUnifiedList();
  const i = list.findIndex(e => e.type === type && String(e.item.id) === String(id));
  if (i <= 0) return;
  const [entry] = list.splice(i, 1);
  list.unshift(entry);
  unifiedOrder = list.map(({type, item}) => ({type, id: item.id}));
  saveUnifiedOrder();
  renderUnifiedList();
}

// ── Drag-and-drop reorder (pointer events — works mouse + touch) ──
let dragState = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  startDrag(e, handle.dataset.id, handle.dataset.type);
}, true);

function startDrag(e, rawId, type) {
  const id = type === 'family' ? parseInt(rawId) : rawId;
  const card = document.getElementById(type === 'family' ? 'fc-' + rawId : 'prc-' + rawId);
  if (!card) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const clone = card.cloneNode(true);
  clone.style.cssText = `position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;`
    + `opacity:0.88;pointer-events:none;z-index:9999;transition:none;`
    + `box-shadow:0 10px 40px rgba(0,0,0,0.55);`;
  document.body.appendChild(clone);
  card.classList.add('dragging-ghost');
  dragState = { type, id, rawId, clone, card, offX: e.clientX - r.left, offY: e.clientY - r.top };
  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup',   onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  dragState.clone.style.top  = (e.clientY - dragState.offY) + 'px';
  dragState.clone.style.left = (e.clientX - dragState.offX) + 'px';
  dragState.clone.style.visibility = 'hidden';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dragState.clone.style.visibility = '';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const target = under?.closest('[id^="prc-"],[id^="fc-"]');
  if (target && target !== dragState.card) target.classList.add('drag-over');
}

function onDragEnd(e) {
  if (!dragState) return;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup',   onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  dragState.clone.style.visibility = 'hidden';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dragState.clone.remove();
  dragState.card.classList.remove('dragging-ghost');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const target = under?.closest('[id^="prc-"],[id^="fc-"]');
  if (target && target !== dragState.card) {
    const tid = target.id;
    const toType = tid.startsWith('prc-') ? 'personal' : 'family';
    const toRaw  = tid.replace(/^prc-|^fc-/, '');
    const list = getUnifiedList();
    const fi = list.findIndex(e => e.type === dragState.type && String(e.item.id) === dragState.rawId);
    const ti = list.findIndex(e => e.type === toType && String(e.item.id) === toRaw);
    if (fi >= 0 && ti >= 0 && fi !== ti) {
      const [entry] = list.splice(fi, 1);
      list.splice(ti, 0, entry);
      unifiedOrder = list.map(({type, item}) => ({type, id: item.id}));
      saveUnifiedOrder();
      renderUnifiedList();
    }
  }
  dragState = null;
}

function exportFamilyCSV() {
  if (!familyDuas.length) { alert('No entries to export.'); return; }
  const headers = ['name','relation','category','your_request','arabic','transliteration','english','urdu','source'];
  const esc = v => '"' + String(v||'').replace(/"/g, '""') + '"';
  const rows = familyDuas.map(f => [
    f.name, f.rel, f.label, f.req, f.arabic, f.trans, f.english, f.urdu, f.source
  ].map(esc).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'arafah-duas-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function importFamilyCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    let added = 0;
    lines.slice(1).forEach((line, i) => {
      const c = parseCSVLine(line);
      if (!c[0]) return;
      const need = c[2] ? Object.keys(FAMILY_DUAS).find(k => FAMILY_DUAS[k].label === c[2]) || '' : '';
      const rich = need ? FAMILY_DUAS[need] : null;
      familyDuas.push({
        id: Date.now() + i + 1,
        name: c[0]||'', rel: c[1]||'', label: c[2]||'', req: c[3]||'',
        arabic:  c[4] || (rich ? rich.arabic  : ''),
        trans:   c[5] || (rich ? rich.trans   : ''),
        english: c[6] || (rich ? rich.english : ''),
        urdu:    c[7] || (rich ? rich.urdu    : ''),
        source:  c[8] || (rich ? rich.source  : ''),
        done: false
      });
      added++;
    });
    saveFamily(); renderUnifiedList();
    alert(added + ' entr' + (added===1?'y':'ies') + ' imported.');
    input.value = '';
  };
  reader.readAsText(file);
}

function parseCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  result.push(cur.trim()); return result;
}

        <div class="dc-trans">${d.trans}</div>
        <div class="dc-english">${d.english}</div>
        <div class="dc-urdu">${d.urdu}</div>
        <div class="dc-source">— ${d.source}</div>
      </div>
    </div>`).join('');
}

function toggleDuaCard(id) {
  document.getElementById('dc-'+id)?.classList.toggle('open');
}

// ── Tab Switching ──────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  currentTab = tab;
}

// ── Init ───────────────────────────────────────────────────────
renderTodayBanner();
renderJourney();
renderUnifiedList();
renderCatPills();
renderDuas();
renderDuasCatPills();
renderDuasTab();
</script>
